<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Immersive mode: Cover, Lyrics, Visualizer">
  <defs>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="cv" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e6deff"/><stop offset=".55" stop-color="#b69cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b69cff"/></linearGradient>
    <clipPath id="c1"><rect width="400" height="270" rx="20"/></clipPath>
    <style>.lbl{font:600 18px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#e9e4ff}.k{font:500 10px Consolas,Menlo,monospace;letter-spacing:3px;fill:#e6deff}</style>
  </defs>
  <rect width="1280" height="330" rx="24" fill="#07060c"/>

  <!-- Cover -->
  <g transform="translate(24 20)">
    <g clip-path="url(#c1)">
      <rect width="400" height="270" fill="#0d0b16"/>
      <circle cx="120" cy="80" r="120" fill="#7c5cff" filter="url(#b)" opacity=".8"/>
      <circle cx="320" cy="220" r="110" fill="#ff8fb8" filter="url(#b)" opacity=".5"/>
      <rect x="40" y="60" width="150" height="150" rx="14" fill="url(#cv)">
        <animateTransform attributeName="transform" type="rotate" values="-3 115 135;3 115 135;-3 115 135" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="210" y="98" class="k">NOW PLAYING</text>
      <rect x="210" y="112" width="150" height="20" rx="6" fill="url(#tt)"/>
      <rect x="210" y="142" width="96" height="10" rx="5" fill="#fff" fill-opacity=".5"/>
      <rect x="210" y="176" width="150" height="4" rx="2" fill="#fff" fill-opacity=".15"/>
      <rect x="210" y="176" width="60" height="4" rx="2" fill="#b69cff"><animate attributeName="width" values="10;150;10" dur="8s" repeatCount="indefinite"/></rect>
      <circle cx="285" cy="208" r="13" fill="#b69cff"/>
    </g>
    <text x="200" y="300" text-anchor="middle" class="lbl">Cover</text>
  </g>

  <!-- Liedtext -->
  <g transform="translate(440 20)">
    <g clip-path="url(#c1)">
      <rect width="400" height="270" fill="#0d0b16"/>
      <circle cx="300" cy="60" r="120" fill="#4fe3ff" filter="url(#b)" opacity=".45"/>
      <rect x="28" y="40" width="80" height="80" rx="10" fill="url(#cv)"/>
      <rect x="28" y="134" width="80" height="10" rx="5" fill="#fff" fill-opacity=".7"/>
      <rect x="28" y="150" width="54" height="8" rx="4" fill="#fff" fill-opacity=".35"/>
      <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="19">
        <text x="140" y="70" fill="#b69cff" fill-opacity=".5">Under a glass sky</text>
        <text x="140" y="112" fill="#fff" font-size="23">colours start to move
          <animate attributeName="fill-opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></text>
        <text x="140" y="152" fill="#fff" fill-opacity=".3">and the night begins</text>
        <text x="140" y="190" fill="#fff" fill-opacity=".18">to sing along</text>
        <text x="140" y="228" fill="#fff" fill-opacity=".08">♪</text>
      </g>
    </g>
    <text x="200" y="300" text-anchor="middle" class="lbl">Lyrics</text>
  </g>

  <!-- Visualizer -->
  <g transform="translate(856 20)">
    <g clip-path="url(#c1)">
      <rect width="400" height="270" fill="#0d0b16"/>
      <circle cx="200" cy="120" r="110" fill="#7c5cff" filter="url(#b)" opacity=".6"/>
      <g transform="translate(200 118)" stroke-linecap="round">
        <g stroke="#b69cff" stroke-width="4">
          <line x1="0" y1="-52" x2="0" y2="-84"><animate attributeName="y2" values="-84;-66;-92;-84" dur="1.2s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-74" transform="rotate(30)"><animate attributeName="y2" values="-74;-92;-70;-74" dur="1s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-90" transform="rotate(60)"><animate attributeName="y2" values="-90;-68;-84;-90" dur="1.3s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-70" transform="rotate(90)"><animate attributeName="y2" values="-70;-88;-74;-70" dur=".9s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-86" transform="rotate(120)"><animate attributeName="y2" values="-86;-66;-90;-86" dur="1.1s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-76" transform="rotate(150)"><animate attributeName="y2" values="-76;-94;-72;-76" dur="1.4s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-88" transform="rotate(180)"><animate attributeName="y2" values="-88;-70;-84;-88" dur="1s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-76" transform="rotate(210)"><animate attributeName="y2" values="-76;-94;-72;-76" dur="1.4s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-86" transform="rotate(240)"><animate attributeName="y2" values="-86;-66;-90;-86" dur="1.1s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-70" transform="rotate(270)"><animate attributeName="y2" values="-70;-88;-74;-70" dur=".9s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-90" transform="rotate(300)"><animate attributeName="y2" values="-90;-68;-84;-90" dur="1.3s" repeatCount="indefinite"/></line>
          <line x1="0" y1="-52" x2="0" y2="-74" transform="rotate(330)"><animate attributeName="y2" values="-74;-92;-70;-74" dur="1s" repeatCount="indefinite"/></line>
        </g>
        <circle r="46" fill="url(#cv)"/>
        <circle r="52" fill="none" stroke="#e6deff" stroke-opacity=".6">
          <animate attributeName="r" values="52;120" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values=".7;0" dur="1s" repeatCount="indefinite"/>
        </circle>
      </g>
      <rect x="130" y="220" width="140" height="12" rx="6" fill="#fff" fill-opacity=".75"/>
    </g>
    <text x="200" y="300" text-anchor="middle" class="lbl">Visualizer</text>
  </g>
</svg>
