<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Mirage – a living Spicetify theme">
  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#e6deff"/>
      <stop offset=".75" stop-color="#b69cff"/>
      <stop offset="1" stop-color="#ff8fb8"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.4;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" x2="1">
      <stop offset="0" stop-color="#e6deff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b69cff"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#e6deff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#07060c"/>
    <g filter="url(#blur)">
      <circle cx="240" cy="110" r="210" fill="#7c5cff">
        <animate attributeName="cx" values="240;430;240" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="90" r="190" fill="#ff5c9a" opacity=".7">
        <animate attributeName="cy" values="90;240;90" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="430" r="230" fill="#4fe3ff" opacity=".5">
        <animate attributeName="cx" values="720;520;720" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="380" r="150" fill="#ff9f45" opacity=".35">
        <animate attributeName="r" values="150;200;150" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="60" y="60" width="210" height="320" rx="22" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/>
    <rect x="290" y="60" width="930" height="236" rx="22" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
    <rect x="290" y="312" width="930" height="68" rx="34" fill="#000" fill-opacity=".35" stroke="#fff" stroke-opacity=".16"/>
    <rect x="420" y="312" width="560" height="1.5" fill="url(#seam)">
      <animate attributeName="x" values="380;600;380" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g fill="#fff">
      <rect x="84" y="92" width="44" height="44" rx="10" fill="#b69cff" fill-opacity=".9"/>
      <rect x="140" y="102" width="100" height="9" rx="4.5" fill-opacity=".55"/>
      <rect x="140" y="118" width="64" height="7" rx="3.5" fill-opacity=".3"/>
      <rect x="84" y="152" width="44" height="44" rx="10" fill="#ff8fb8" fill-opacity=".85"/>
      <rect x="140" y="162" width="90" height="9" rx="4.5" fill-opacity=".45"/>
      <rect x="140" y="178" width="54" height="7" rx="3.5" fill-opacity=".25"/>
      <rect x="84" y="212" width="44" height="44" rx="10" fill="#4fe3ff" fill-opacity=".8"/>
      <rect x="140" y="222" width="96" height="9" rx="4.5" fill-opacity=".45"/>
      <rect x="140" y="238" width="60" height="7" rx="3.5" fill-opacity=".25"/>
    </g>
    <text x="330" y="205" font-family="Segoe UI Variable Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-6" fill="url(#title)">Mirage</text>
    <text x="336" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9e4ff" fill-opacity=".85">A living Spicetify theme · glass · cover colours · lyrics · visualizer</text>
    <text x="338" y="92" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="5" fill="#e6deff" fill-opacity=".8">SPICETIFY THEME</text>
    <g transform="translate(1118 178)">
      <circle r="78" fill="#120f1d" stroke="#b69cff" stroke-opacity=".5" stroke-width="2"/>
      <circle r="60" fill="none" stroke="#fff" stroke-opacity=".08"/>
      <circle r="44" fill="none" stroke="#fff" stroke-opacity=".08"/>
      <g>
        <path d="M0 -78 A78 78 0 0 1 67 -39" fill="none" stroke="#e6deff" stroke-width="3" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      </g>
      <circle r="26" fill="#b69cff"/>
      <circle r="6" fill="#07060c"/>
    </g>
    <rect x="318" y="326" width="40" height="40" rx="10" fill="#b69cff"/>
    <rect x="372" y="334" width="150" height="9" rx="4.5" fill="#fff" fill-opacity=".7"/>
    <rect x="372" y="350" width="96" height="7" rx="3.5" fill="#fff" fill-opacity=".35"/>
    <circle cx="755" cy="346" r="20" fill="#b69cff"/>
    <path d="M749 336 L765 346 L749 356 Z" fill="#0b0a12"/>
    <circle cx="755" cy="346" r="25" fill="none" stroke="#e6deff" stroke-width="1.5" stroke-dasharray="20 60" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 755 346" to="360 755 346" dur="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="960" y="342" width="220" height="4" rx="2" fill="#fff" fill-opacity=".12"/>
    <rect x="960" y="342" width="90" height="4" rx="2" fill="#b69cff">
      <animate attributeName="width" values="20;220;20" dur="12s" repeatCount="indefinite"/>
    </rect>
    <g fill="url(#bar)">
      <rect x="880" y="330" width="5" height="20" rx="2.5"><animate attributeName="height" values="6;26;6" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="350;330;350" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="890" y="330" width="5" height="20" rx="2.5"><animate attributeName="height" values="22;6;22" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="334;350;334" dur=".8s" repeatCount="indefinite"/></rect>
      <rect x="900" y="330" width="5" height="20" rx="2.5"><animate attributeName="height" values="10;26;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="346;330;346" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="910" y="330" width="5" height="20" rx="2.5"><animate attributeName="height" values="18;8;18" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="338;348;338" dur=".7s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
