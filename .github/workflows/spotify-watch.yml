name: Spotify watch

# Every night: unpack the newest Spotify desktop client and check whether Mirage's selectors still match.
# If something stopped matching, an issue is opened (or updated) so it can be fixed before users notice,
# often with a rule in remote/fixes.json and without a new release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Windows is usually a few days ahead of Linux, so try the Windows setup first. Its format is not
      # documented; when it cannot be unpacked, the official Linux package is used (it holds xpui.spa directly).
      - name: Download and unpack the newest Spotify client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full unzip
          SPA=""
          if curl -fsSL --max-time 300 -o spotify.exe https://download.scdn.co/SpotifyFullSetupX64.exe; then
            echo "Windows setup: $(stat -c %s spotify.exe) bytes"
            7z l spotify.exe 2>&1 | tail -n 15 || true
            7z x -y -ospotify spotify.exe > /dev/null 2>&1 || true
            # the setup holds the app as one big embedded block (7-Zip lists it as "[0]"); unpack that and any archive in it
            find spotify -type f -size +10M 2>/dev/null | head -5 | while read -r inner; do
              echo "inner: $inner ($(stat -c %s "$inner") bytes)"
              7z x -y -ospotify/inner "$inner" > /dev/null 2>&1 || true
            done
            find spotify/inner -type f -size +10M 2>/dev/null | head -5 | while read -r inner; do
              7z x -y -ospotify/inner2 "$inner" > /dev/null 2>&1 || true
            done
            SPA=$(find spotify -name xpui.spa 2>/dev/null | head -1)
            VERSION=$(strings spotify.exe 2>/dev/null | grep -o -E '1\.[0-9]+\.[0-9]+\.[0-9]+\.g[0-9a-f]+' | head -1 || true)
            SOURCE="Windows setup"
          fi
          if [ -z "$SPA" ]; then
            echo "Windows setup could not be unpacked, using the Linux package"
            BASE=http://repository.spotify.com
            curl -fsSL --max-time 60 -o Packages "$BASE/dists/testing/non-free/binary-amd64/Packages"
            # newest spotify-client entry: version, file name and checksum
            read -r VERSION FILE SUM < <(awk '
              /^Package: /{p=($2=="spotify-client"); v=f=s=""}
              p&&/^Version: /{v=$2} p&&/^Filename: /{f=$2} p&&/^SHA256: /{s=$2}
              p&&/^$/{if(f)print v, f, s; p=0}
              END{if(p&&f)print v, f, s}' Packages | sort -V | tail -n 1)
            test -n "$FILE"
            curl -fsSL --max-time 600 -o spotify.deb "$BASE/$FILE"
            echo "$SUM  spotify.deb" | sha256sum -c -
            dpkg-deb -x spotify.deb deb
            SPA=$(find deb -name xpui.spa | head -1)
            VERSION="${VERSION#*:}"
            SOURCE="Linux package"
          fi
          test -n "$SPA"
          # 7-Zip instead of unzip: Spotify's archive has a "/" entry that unzip rejects with exit code 2
          7z x -y -oxpui "$SPA" > /dev/null
          test -n "$(ls xpui/*.css 2>/dev/null | head -1)"
          echo "SPOTIFY_VERSION=${VERSION:-unknown} (${SOURCE})" >> "$GITHUB_ENV"
          echo "Checking Spotify ${VERSION:-unknown} from the ${SOURCE}: $(ls xpui | wc -l) files"

      - name: Download Spicetify's name list
        run: curl -fsSL -o css-map.json https://raw.githubusercontent.com/spicetify/cli/main/css-map.json

      - name: Check selectors
        id: check
        run: |
          set +e
          node tools/check-selectors.js --xpui xpui --cssmap css-map.json | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Spotify watch: selectors stopped matching"
          {
            echo "The nightly check found rules that no longer match the newest Spotify client (${SPOTIFY_VERSION})."
            echo
            echo '```'
            head -c 6000 report.txt
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
          exit 1
