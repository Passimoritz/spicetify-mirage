name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Everything between "## [VERSION]" and the next "## [" heading
          # (or the link reference definitions at the bottom of the file).
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1; next }
            }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ] || ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "No section for [$VERSION] found in CHANGELOG.md" >&2
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Mirage ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # README links to releases/latest/download/fix-spicetify.cmd
          files: tools/fix-spicetify.cmd

      # Marketplace lädt das Theme über jsDelivr (…/gh/<user>/<repo>@main/…), das Branch-Dateien bis zu
      # 12 Stunden zwischenspeichert. Ohne Leeren bekämen Nutzer die neue Version erst Stunden später.
      - name: Purge jsDelivr cache for Marketplace
        run: |
          for f in Mirage/theme.js Mirage/user.css Mirage/color.ini manifest.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null && echo "purged $f" || echo "purge failed for $f"
          done

  # Mirage Overlay als fertige Installer: Windows (.exe), macOS (.dmg, universal), Linux (.AppImage, .deb).
  # Jedes System baut auf seinem eigenen Runner; die Dateien landen am Release, den der Job oben anlegt.
  overlay:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: overlay/dist/Mirage-Overlay-Setup.exe
          - os: macos-latest
            target: --mac
            files: overlay/dist/Mirage-Overlay.dmg
          - os: ubuntu-latest
            target: --linux
            files: |
              overlay/dist/Mirage-Overlay.AppImage
              overlay/dist/Mirage-Overlay.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # unsigniert bauen (kein Zertifikat hinterlegt)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
