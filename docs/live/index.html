<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" id="chrome" content="#06050b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Mirage Live</title>
<script src="fx.js" defer></script>
<style>
  /* Mirage Live: das Handy als Lichtquelle im Raum. Das Licht malt ein Canvas (drei treibende Lichtquellen
     in den Songfarben, Ringe im Takt, Blitz beim Drop); darüber nur schlanke Glas-Elemente. */
  :root { --a: 155, 107, 240; --b: 34, 73, 231; --c: 217, 188, 241; --chrome: #06050b; background: var(--chrome); }
  ::backdrop { background: var(--chrome); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--chrome); color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "SF Pro Display", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .top { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; }
  .brand { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 12px; border-radius: 99px; background: rgba(10, 8, 20, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 11px; font-weight: 700; letter-spacing: 0.28em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); transition: background 0.4s, box-shadow 0.4s; }
  body.on .dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  /* Verbindung: der Punkt sagt es immer, Text kommt nur dazu, wenn sie länger weg ist */
  body.lost .dot { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; animation: blink 0.8s ease-in-out infinite; }
  body.quiet:not(.lost) .dot { background: #fbbf24; box-shadow: none; animation: none; }
  .net { padding-left: 9px; border-left: 1px solid rgba(255, 255, 255, 0.22); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
  .net:empty { display: none; }
  /* Wer bin ich: Knopf oben rechts in der eigenen Farbe, dahinter Name und Farbe zum Ändern */
  .mebtn { position: absolute; right: 14px; top: 0; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85); color: #0b0a12; font: inherit; font-size: 13px; font-weight: 800; line-height: 1; }
  .mebtn[hidden], .prof[hidden] { display: none; }
  .prof { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; padding: 20px; background: rgba(6, 5, 11, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .pbox { display: grid; gap: 14px; width: min(360px, 100%); padding: 20px 18px; border-radius: 24px; background: rgba(14, 12, 24, 0.94); border: 1px solid rgba(255, 255, 255, 0.14); text-align: center; }
  .pbox h2 { font-size: 21px; letter-spacing: -0.01em; }
  .pbox p { font-size: 14px; line-height: 1.4; opacity: 0.7; }
  .pbox input { height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.06); color: #fff; font: inherit; font-size: 16px; text-align: center; -webkit-user-select: text; user-select: text; }
  .pbox .go { min-height: 50px; border: 0; border-radius: 16px; color: #0b0a12; background: rgb(var(--c)); font: inherit; font-size: 16px; font-weight: 700; }
  .sw { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .sw .swb { flex: none; width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .sw .swb[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); transform: scale(1.1); }
  /* Spielleitung: nur auf dem Handy mit dem eigenen Link */
  .hostbtn { position: absolute; left: 14px; top: 0; width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(10, 8, 20, 0.5); font-size: 14px; line-height: 1; }
  .hostbtn[hidden] { display: none; }
  .host .pbox { max-height: calc(100dvh - 40px); overflow: auto; overscroll-behavior: contain; text-align: left; }
  .host .shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .host .x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; color: #fff; font: inherit; font-size: 15px; background: rgba(255, 255, 255, 0.1); }
  .hbody { display: grid; gap: 10px; }
  .hbody button { min-height: 44px; padding: 8px 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.07); color: #fff; font: inherit; font-size: 15px; font-weight: 700; touch-action: manipulation; }
  .hbody button.end { background: rgba(226, 59, 85, 0.3); border-color: rgba(226, 59, 85, 0.6); }
  .hbody small { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
  .hbody .hnow { font-size: 16px; font-weight: 700; opacity: 1; }
  .hgames, .hacts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hgames button { min-width: 0; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
  .hsteps { display: flex; gap: 6px; }
  .hsteps button { flex: 1; min-height: 36px; }
  .hsteps button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.28); }
  .hrow { display: flex; align-items: center; gap: 8px; }
  .hrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
  .hrow b { min-width: 44px; text-align: right; }
  .hrow button { flex: none; width: 44px; padding: 0; font-size: 20px; }
  .gdot { flex: none; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; vertical-align: middle; }
  .grow .gdot { margin-right: 0; }
  .grow.me { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.6); }
  .card { position: fixed; left: 14px; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border-radius: 22px; background: rgba(10, 8, 20, 0.38); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    transform: translateY(140%); transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.6s; }
  body.on .card { transform: none; }
  body.on.loud .card { opacity: 0.55; }
  .cov { flex: none; width: 52px; height: 52px; border-radius: 12px; object-fit: cover; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); background: rgba(255, 255, 255, 0.08); }
  .cov[hidden] { display: none; }
  .eq { flex: none; display: flex; align-items: flex-end; gap: 3px; height: 22px; width: 22px; }
  .eq i { flex: 1; border-radius: 2px; background: rgb(var(--a)); height: 30%; transition: height 0.08s; }
  .eq i:nth-child(2) { background: rgb(var(--b)); }
  .eq i:nth-child(3) { background: rgb(var(--c)); }
  .meta { min-width: 0; flex: 1; }
  .meta b, .meta span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .meta span { margin-top: 2px; font-size: 13px; opacity: 0.7; }
  .bpm { flex: none; padding: 5px 9px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.85; }
  .state { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 32px; text-align: center; transition: opacity 0.6s; pointer-events: none; }
  body.on .state { opacity: 0; }
  .orb { width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(var(--c), 0.95), rgba(var(--a), 0.75) 45%, rgba(var(--b), 0.25) 75%, transparent);
    box-shadow: 0 0 60px rgba(var(--a), 0.55); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(0.86); opacity: 0.7; } }
  .state b { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .state p { max-width: 21em; font-size: 14px; line-height: 1.5; opacity: 0.7; }
  .tap { position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); text-align: center; font-size: 12px; letter-spacing: 0.06em; opacity: 0.55; transition: opacity 0.5s; }
  body.on .tap, body.armed .tap { opacity: 0; }
  body.needvib .tap { opacity: 1 !important; left: 50%; right: auto; top: max(60px, calc(env(safe-area-inset-top) + 48px)); bottom: auto; z-index: 2; transform: translateX(-50%); padding: 8px 14px; border-radius: 99px; width: max-content; max-width: calc(100vw - 32px);
    background: rgba(var(--a), 0.55); font-weight: 700; }
  /* Werkzeugleiste über der Karte: Liedtext, Wunsch, Vibration */
  .tools { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px); display: flex; gap: 4px; padding: 5px; width: max-content; max-width: calc(100vw - 24px); border-radius: 99px;
    background: rgba(10, 8, 20, 0.42); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    transform: translate(-50%, 260%); transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1); }
  body.on .tools { transform: translate(-50%, 0); }
  .tools button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tools button { flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 15px; border-radius: 99px; border: 0; color: #fff; font: inherit; font-size: 13px; font-weight: 650;
    background: transparent; white-space: nowrap; transition: background 0.25s, transform 0.15s; }
  .tools button:active { transform: scale(0.95); }
  .tools button svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
  .tools button[aria-pressed="true"] { background: rgba(var(--a), 0.6); }
  .tools #bWish { background: rgb(var(--c)); color: #0b0a12; }
  .tools button[hidden] { display: none; }
  /* Liedtext zum Mitsingen: groß in der Mitte, die nächste Zeile klein darunter */
  .lyr { position: fixed; left: 20px; right: 20px; top: max(60px, calc(env(safe-area-inset-top) + 48px)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 204px); display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; overflow-wrap: anywhere; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
  body.poll-on .lyr { visibility: hidden; }
  body.on.lyrics .lyr.has { opacity: 1; }
  .lyr b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; font-size: clamp(22px, min(8.5vw, 6vh), 46px); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.45); }
  .lyr span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 14px; font-size: clamp(15px, 4.4vw, 21px); font-weight: 600; opacity: 0.55; }
  /* Songwünsche: Blatt von unten */
  /* über der Bildschirmtastatur: --kb = Tastaturhöhe, --vvh = sichtbare Höhe (visualViewport) */
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); max-height: calc(var(--vvh, 100dvh) - max(24px, env(safe-area-inset-top))); overflow: auto; overscroll-behavior: contain;
    padding: 0 16px max(18px, env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
    background: rgba(14, 12, 24, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.45); transform: translateY(105%); transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.2, 1), bottom 0.2s; }
  .sheet .top2 { position: sticky; top: 0; z-index: 1; padding: 10px 0 10px; background: linear-gradient(rgba(14, 12, 24, 1) 85%, rgba(14, 12, 24, 0)); }
  .sheet .grab { width: 40px; height: 4px; margin: 0 auto 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.25); }
  .sheet .shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet .x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; color: #fff; font: inherit; font-size: 15px; background: rgba(255, 255, 255, 0.1); }
  .sheet .field { position: relative; margin-top: 12px; }
  .sheet .field svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: rgba(255, 255, 255, 0.6); pointer-events: none; }
  .sheet .field input { padding-left: 42px; margin-bottom: 0; }
  .sheet .name { margin-top: 14px; }
  .sheet .name input { height: 40px; font-size: 15px; background: transparent; }
  body.wish .sheet { transform: none; }
  .sheet { z-index: 5; }
  body.wish .card, body.wish .tools, body.wish .lyr { opacity: 0 !important; pointer-events: none; }
  .sheet h2 { font-size: 20px; letter-spacing: -0.01em; }
  .sheet .hint { font-size: 13px; line-height: 1.45; opacity: 0.65; margin-top: 4px; }
  .sheet input { width: 100%; height: 46px; margin-bottom: 10px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.06);
    color: #fff; font: inherit; font-size: 16px; }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .send { flex: 1; height: 46px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700; color: #0b0a12; background: rgb(var(--c)); }
  .sheet .close { height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: transparent; color: #fff; font: inherit; }
  .sheet .msg { min-height: 20px; margin: 10px 0 4px; font-size: 13px; opacity: 0.8; }
  /* eine Spalte, die nie breiter als das Blatt wird (sonst schieben lange Titel die Zeile aus dem Bild) */
  .wl { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 8px; }
  .wl li { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); transition: background 0.2s, transform 0.15s; }
  .wl li:active { transform: scale(0.98); }
  .res li .go { color: #0b0a12; background: rgb(var(--c)); border: 0; min-width: 0; padding: 0 14px; font-size: 13px; }
  .wl li div { flex: 1; min-width: 0; }
  .wl b, .wl small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wl small { font-size: 12px; opacity: 0.6; }
  .wl button { flex: none; min-width: 58px; height: 34px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.16); background: transparent; color: #fff; font: inherit; font-weight: 700; }
  .wl button[aria-pressed="true"] { background: rgba(var(--a), 0.55); }
  .wl .ok { font-size: 12px; opacity: 0.8; }
  .wl img { flex: none; width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: rgba(255, 255, 255, 0.08); }
  .res li { cursor: pointer; }
  .res li.picked { background: rgba(var(--a), 0.4); }
  .sheet .sub { margin-top: 12px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
  .sheet .close { width: 100%; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { .orb, body.on .dot { animation: none; } }
  /* Reaktionen: eine Reihe Emojis über der Werkzeugleiste */
  .reacts { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 150px); display: flex; gap: 6px; transform: translate(-50%, 320%); transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1); }
  body.on .reacts { transform: translate(-50%, 0); }
  body.wish .reacts { opacity: 0; pointer-events: none; }
  body.norx .reacts { display: none; }
  .reacts button { flex: 0 1 44px; min-width: 0; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(10, 8, 20, 0.42); font-size: 22px; line-height: 1;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform 0.15s; }
  .reacts button:active { transform: scale(0.85); }
  .fly { position: fixed; bottom: 200px; font-size: 34px; pointer-events: none; animation: fly 1.6s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), -45vh) scale(1.4); opacity: 0; } }
  /* Ansage des Gastgebers und „dein Song kommt gleich“: Band oben */
  .note { position: fixed; left: 14px; right: 14px; top: max(64px, calc(env(safe-area-inset-top) + 52px)); z-index: 4; padding: 14px 16px; border-radius: 18px;
    background: rgba(10, 8, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.16); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transform: translateY(-160%); transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.2, 1); }
  .note.show { transform: none; visibility: visible; transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.2, 1); }
  /* versteckt wirklich aus dem Bild: leer ragte die Leiste sonst als schwarzer Streifen oben hinein */
  .note:not(.show) { visibility: hidden; transform: translateY(calc(-100% - 120px)); transition: transform 0.4s, visibility 0s 0.4s; }
  /* erst nach dem Beitreten: die Bedienung gehört zur laufenden Party */
  body:not(.on) :is(.reacts, .tools, .card) { visibility: hidden; }
  .note small { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
  .note b { display: block; margin-top: 4px; font-size: 19px; line-height: 1.25; }
  /* Abstimmung: drei Songs zur Wahl */
  .poll { position: fixed; left: 14px; right: 14px; top: max(60px, calc(env(safe-area-inset-top) + 48px)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 204px); height: fit-content; max-height: calc(100dvh - max(60px, calc(env(safe-area-inset-top) + 48px)) - max(16px, env(safe-area-inset-bottom)) - 204px); margin: auto 0; overflow: auto; z-index: 3; padding: 14px; border-radius: 22px; background: rgba(10, 8, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: grid; gap: 8px; }
  .poll[hidden] { display: none; }
  .poll h3 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  .poll button { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 52px; padding: 6px 12px 6px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.05); color: #fff; font: inherit; font-size: 14px; font-weight: 650; text-align: left; }
  .poll button::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: rgba(var(--a), 0.45); transition: width 0.5s; }
  .poll button > * { position: relative; }
  .poll button img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .poll button span { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
  .poll button.me { border-color: rgb(var(--c)); }
  body.wish .poll { display: none; }
  /* Spiele: füllen das Handy, das Licht scheint dahinter weiter. Die Farben der Felder sind dieselben wie auf dem großen Bild. */
  .game { position: fixed; inset: max(60px, calc(env(safe-area-inset-top) + 48px)) 10px max(12px, env(safe-area-inset-bottom)); z-index: 3; display: flex; flex-direction: column; border-radius: 26px; overflow: hidden;
    text-align: center; background: linear-gradient(170deg, rgba(var(--a), 0.26), rgba(10, 8, 20, 0.84) 45%); border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .game[hidden] { display: none; }
  body.game-on .card, body.game-on .tools, body.game-on .reacts, body.game-on .lyr, body.game-on .poll { visibility: hidden; }
  .ghead { position: relative; flex: none; display: flex; align-items: center; gap: 8px; padding: 13px 14px 11px; font-size: 13px; font-weight: 700; }
  .gbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.1); }
  .gbar b { display: block; height: 100%; width: 0; background: rgb(var(--c)); transition: width 0.2s linear; }
  .gic { font-size: 18px; line-height: 1; }
  .gnm { flex: 1; min-width: 0; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .grd, .gtm { flex: none; padding: 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); font-variant-numeric: tabular-nums; }
  .gtm:empty { display: none; }
  /* der Inhalt scrollt in sich; margin:auto zentriert, ohne oben etwas unerreichbar abzuschneiden */
  .gbody { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding: 14px; overflow-wrap: anywhere; animation: gin 0.35s cubic-bezier(0.2, 0.9, 0.2, 1) both; }
  .gbody > :first-child { margin-top: auto; }
  .gbody > :last-child { margin-bottom: auto; }
  .gbody > * { flex: none; }
  .gbody, .poll, .sheet { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }

        const r = gEl("div", null, "hrow"), pts = gEl("b", "");
        pts.dataset.i = x.i;
        r.append(colDot(x.c), gEl("span", String(x.n ?? "")), pts, btn("−", "", () => hostCmd("pts", x.i, -hostStep)), btn("+", "", () => hostCmd("pts", x.i, hostStep)));
        body.append(r);
      }
    }
  }
  // die Stände laufen mit, ohne die Knöpfe unter dem Finger neu zu bauen
  for (const b of body.querySelectorAll("b[data-i]")) b.textContent = String(g?.sc?.[b.dataset.i] ?? 0);
}
$("host").addEventListener("click", (e) => e.stopPropagation());
$("bHost").onclick = (e) => {
  e.stopPropagation();
  $("host").hidden = false;
  hostDrawn = "";
  drawHost();
};
$("hClose").onclick = () => ($("host").hidden = true);
hostInit();

/* ---- Wortbilder (wie im Party-Modus, der PC schickt mit, welches Wort gerade ein Bild hat) */
let wfx = null, fxSt = null, covR = null, covN = 0, lastFxAt = 0;
addEventListener("load", () => {
  try { wfx = window.MirageFx?.create() || null; } catch {}
});
addEventListener("resize", () => (covR = null));
function wordFx(f) {
  if (!wfx || !fxSt) return;
  wfx.fire(f.c, fxSt);
  const w = String(f.w || ""), line = $("ly").textContent, at = w ? line.toLocaleLowerCase().indexOf(w.toLocaleLowerCase()) : -1;
  if (at < 0) return;
  const col = window.MirageFx.glowOf(f.c) || pal[0];
  const sp = document.createElement("span");
  sp.className = "fxw";
  sp.style.setProperty("--fxc", col.join(","));
  sp.textContent = line.slice(at, at + w.length);
  $("ly").replaceChildren(line.slice(0, at), sp, line.slice(at + w.length));
}

// Antippen: Vollbild und Display anlassen
let lock = null;
let triedFull = false;
document.addEventListener("click", async () => {
  document.body.classList.add("armed");
  if (!triedFull && !document.fullscreenElement) {
    triedFull = true;
    document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
  }
  if (lock && !lock.released) return;
  try {
    lock = await navigator.wakeLock?.request("screen");
  } catch {}
});
document.addEventListener("visibilitychange", async () => {
  if (lock && document.visibilityState === "visible") lock = await navigator.wakeLock?.request("screen").catch(() => null);
});
$("scanBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  openScan();
});
$("scanX").addEventListener("click", (e) => {
  e.stopPropagation();
  stopScan();
});
$("scanLink").addEventListener("click", (e) => e.stopPropagation());
$("scanLink").addEventListener("input", (e) => {
  const raw = e.target.value.trim();
  if (!raw) return void ($("scanMsg").textContent = "");
  const hash = joinHash(raw);
  if (hash) joinNow(hash);
  else $("scanMsg").textContent = T.scanBad;
});
start();
