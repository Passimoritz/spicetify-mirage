<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Mirage Live</title>
<style>
  /* Mirage Live: das Handy als Lichtquelle im Raum – Farben des Songs, Puls im Takt, Blitz beim Drop */
  :root { --a: 155, 107, 240; --b: 34, 73, 231; --c: 217, 188, 241; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #light { position: fixed; inset: -60%; opacity: 0.12; background:
      radial-gradient(circle at 30% 30%, rgba(var(--a), 0.95), transparent 55%),
      radial-gradient(circle at 75% 60%, rgba(var(--b), 0.9), transparent 55%),
      radial-gradient(circle at 40% 90%, rgba(var(--c), 0.7), transparent 50%);
    filter: saturate(1.4); will-change: transform, opacity; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 0.3em; opacity: 0.6; text-transform: uppercase; }
  footer { position: fixed; left: 18px; right: 18px; bottom: max(20px, env(safe-area-inset-bottom)); transition: opacity 0.6s; }
  footer b, footer span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }
  footer b { font-size: 17px; }
  footer span { font-size: 13px; opacity: 0.75; }
  #state { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 28px; font-size: 15px; line-height: 1.45; opacity: 0.85; pointer-events: none; transition: opacity 0.5s; }
  body.on #state { opacity: 0; }
  body.on.loud footer { opacity: 0.25; }
</style>
</head>
<body>
<div id="light"></div>
<div id="flash"></div>
<header>Mirage Live</header>
<div id="state"></div>
<footer><b></b><span></span></footer>
<script>

// Kleinstmöglicher MQTT-3.1.1-Client über WebSocket: verbinden, veröffentlichen, abonnieren, Ping.
// Mehrere öffentliche Relays: wer zuerst antwortet, wird benutzt; fällt einer aus, der nächste.
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const te = new TextEncoder();
const mqStr = (s) => {
  const b = te.encode(s);
  return [b.length >> 8, b.length & 255, ...b];
};
const mqLen = (n) => {
  const o = [];
  do {
    let d = n % 128;
    n = Math.floor(n / 128);
    if (n) d |= 128;
    o.push(d);
  } while (n);
  return o;
};
const mqPkt = (h, body) => new Uint8Array([h, ...mqLen(body.length), ...body]);
function mqttOpen(url, { onReady, onMessage, onClose }) {
  const ws = new WebSocket(url, "mqtt");
  ws.binaryType = "arraybuffer";
  let buf = new Uint8Array(0), ping = 0;
  ws.onopen = () => {
    const id = "mirage-" + Math.random().toString(36).slice(2, 12);
    ws.send(mqPkt(0x10, [...mqStr("MQTT"), 4, 2, 0, 60, ...mqStr(id)]));
  };
  ws.onmessage = (e) => {
    const add = new Uint8Array(e.data), nb = new Uint8Array(buf.length + add.length);
    nb.set(buf);
    nb.set(add, buf.length);
    buf = nb;
    // ein WebSocket-Rahmen kann mehrere oder halbe MQTT-Pakete enthalten
    for (;;) {
      if (buf.length < 2) break;
      let len = 0, mul = 1, i = 1, b;
      do {
        if (i >= buf.length) return;
        b = buf[i++];
        len += (b & 127) * mul;
        mul *= 128;
      } while (b & 128);
      if (buf.length < i + len) break;
      const type = buf[0] >> 4, body = buf.subarray(i, i + len);
      buf = buf.slice(i + len);
      if (type === 2 && body[1] === 0) {
        ping = setInterval(() => ws.readyState === 1 && ws.send(new Uint8Array([0xc0, 0])), 30000);
        onReady?.(api);
      } else if (type === 3) {
        const tl = (body[0] << 8) | body[1];
        onMessage?.(body.slice(2 + tl));
      }
    }
  };
  ws.onclose = ws.onerror = () => {
    clearInterval(ping);
    if (api.closed) return;
    api.closed = true;
    onClose?.();
  };
  const api = {
    closed: false,
    publish: (topic, payload, retain) => ws.readyState === 1 && ws.send(mqPkt(0x30 | (retain ? 1 : 0), [...mqStr(topic), ...payload])),
    subscribe: (topic) => ws.readyState === 1 && ws.send(mqPkt(0x82, [0, 1, ...mqStr(topic), 0])),
    close: () => {
      api.closed = true;
      clearInterval(ping);
      try {
        ws.send(new Uint8Array([0xe0, 0]));
        ws.close();
      } catch {}
    },
  };
  return api;
}

  // Kanal und Schlüssel stehen nur hinter dem „#“ – dieser Teil wird nie an einen Server geschickt
  const de = /^de/i.test(navigator.language || "");
  const T = {
    tap: de ? "Antippen für Vollbild – Display bleibt an" : "Tap for full screen – the screen stays on",
    wait: de ? "Verbunden – warte auf den Party-Modus in Spotify …" : "Connected – waiting for party mode in Spotify …",
    over: de ? "Party beendet. Neue Party, neuer QR-Code." : "Party is over. New party, new QR code.",
    bad: de ? "Dieser Link ist unvollständig – bitte den QR-Code neu scannen." : "This link is incomplete – please scan the QR code again.",
    net: de ? "Keine Verbindung – versuche es erneut …" : "No connection – retrying …",
  };
  const $ = (s) => document.querySelector(s);
  const light = $("#light"), flash = $("#flash"), state = $("#state");
  const say = (s) => (state.textContent = s);
  const p = new URLSearchParams(location.hash.slice(1));
  const fromB64 = (s) => Uint8Array.from(atob(String(s || "").replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  let key = null, topic = "", cur = null, recvAt = 0, ended = false;
  async function start() {
    try {
      const raw = fromB64(p.get("k")), ch = p.get("c") || "";
      if (raw.length !== 16 || !/^[\w-]{16,}$/.test(ch)) throw 0;
      key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      topic = "mirage-live/" + ch;
    } catch {
      return say(T.bad);
    }
    say(T.tap);
    // alle Relays zugleich abonnieren: das Theme sendet an den, der bei ihm erreichbar ist
    BROKERS.forEach((url) => open(url));
  }
  function open(url) {
    mqttOpen(url, {
      onReady: (c) => {
        c.subscribe(topic);
        if (!cur && !ended) say(T.wait);
      },
      onMessage: (m) => receive(m),
      onClose: () => {
        if (!cur) say(T.net);
        setTimeout(() => open(url), 3000);
      },
    });
  }
  async function receive(m) {
    if (m.length < 29) return;
    let s;
    try {
      s = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: m.slice(0, 12) }, key, m.slice(12))));
    } catch {
      return; // nicht mit unserem Schlüssel – ignorieren
    }
    if (cur && s.s < cur.s) return; // ältere Nachricht über den zweiten Relay
    if (!s.on) {
      ended = true;
      cur = null;
      document.body.classList.remove("on");
      return say(T.over);
    }
    ended = false;
    cur = s;
    recvAt = performance.now();
    if (Array.isArray(s.pal)) s.pal.forEach((c, i) => Array.isArray(c) && document.documentElement.style.setProperty(["--a", "--b", "--c"][i], c.join(",")));
    $("footer b").textContent = s.t || "";
    $("footer span").textContent = s.a || "";
    document.body.classList.add("on");
  }
  // jedes Bild: den Takt aus Tempo und Schlagphase selbst weiterrechnen – flüssig, auch wenn Nachrichten zittern
  function frame(now) {
    requestAnimationFrame(frame);
    if (!cur) return;
    const age = (now - recvAt) / 1000;
    if (age > 4) {
      document.body.classList.remove("on");
      if (!ended) say(T.wait);
      return;
    }
    const bp = (cur.bi >= 0 ? cur.ph : 0) + age * (cur.bpm / 60);
    const kick = Math.exp(-(bp - Math.floor(bp)) * 6) * (0.35 + 0.65 * cur.e);
    const drop = Math.max(0, cur.d - age * 0.6);
    light.style.opacity = Math.min(1, 0.2 + cur.e * 0.5 + kick * 0.35).toFixed(3);
    light.style.transform = `scale(${(1 + kick * 0.08 + drop * 0.06).toFixed(3)}) rotate(${((now / 90) % 360).toFixed(1)}deg)`;
    flash.style.opacity = (drop > 0.85 ? (drop - 0.85) * 4 : 0).toFixed(3);
    document.body.classList.toggle("loud", cur.e > 0.5);
  }
  requestAnimationFrame(frame);
  let lock = null;
  document.addEventListener("click", async () => {
    document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
    try {
      lock = await navigator.wakeLock?.request("screen");
    } catch {}
  });
  document.addEventListener("visibilitychange", async () => {
    if (lock && document.visibilityState === "visible") lock = await navigator.wakeLock?.request("screen").catch(() => null);
  });
  start();
</script>
</body>
</html>
