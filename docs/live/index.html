<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#06050b">
<meta name="robots" content="noindex">
<title>Mirage Live</title>
<script src="fx.js" defer></script>
<style>
  /* Mirage Live: das Handy als Lichtquelle im Raum. Das Licht malt ein Canvas (drei treibende Lichtquellen
     in den Songfarben, Ringe im Takt, Blitz beim Drop); darüber nur schlanke Glas-Elemente. */
  :root { --a: 155, 107, 240; --b: 34, 73, 231; --c: 217, 188, 241; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #06050b; color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "SF Pro Display", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .top { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; }
  .brand { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 12px; border-radius: 99px; background: rgba(10, 8, 20, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 11px; font-weight: 700; letter-spacing: 0.28em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); transition: background 0.4s, box-shadow 0.4s; }
  body.on .dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  .card { position: fixed; left: 14px; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border-radius: 22px; background: rgba(10, 8, 20, 0.38); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    transform: translateY(140%); transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.6s; }
  body.on .card { transform: none; }
  body.on.loud .card { opacity: 0.55; }
  .cov { flex: none; width: 52px; height: 52px; border-radius: 12px; object-fit: cover; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); background: rgba(255, 255, 255, 0.08); }
  .cov[hidden] { display: none; }
  .eq { flex: none; display: flex; align-items: flex-end; gap: 3px; height: 22px; width: 22px; }
  .eq i { flex: 1; border-radius: 2px; background: rgb(var(--a)); height: 30%; transition: height 0.08s; }
  .eq i:nth-child(2) { background: rgb(var(--b)); }
  .eq i:nth-child(3) { background: rgb(var(--c)); }
  .meta { min-width: 0; flex: 1; }
  .meta b, .meta span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .meta span { margin-top: 2px; font-size: 13px; opacity: 0.7; }
  .bpm { flex: none; padding: 5px 9px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.85; }
  .state { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 32px; text-align: center; transition: opacity 0.6s; pointer-events: none; }
  body.on .state { opacity: 0; }
  .orb { width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(var(--c), 0.95), rgba(var(--a), 0.75) 45%, rgba(var(--b), 0.25) 75%, transparent);
    box-shadow: 0 0 60px rgba(var(--a), 0.55); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(0.86); opacity: 0.7; } }
  .state b { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .state p { max-width: 21em; font-size: 14px; line-height: 1.5; opacity: 0.7; }
  .tap { position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); text-align: center; font-size: 12px; letter-spacing: 0.06em; opacity: 0.55; transition: opacity 0.5s; }
  body.on .tap, body.armed .tap { opacity: 0; }
  body.needvib .tap { opacity: 1 !important; left: 50%; right: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 156px); transform: translateX(-50%); padding: 8px 14px; border-radius: 99px;
    background: rgba(var(--a), 0.55); font-weight: 700; white-space: nowrap; }
  /* Werkzeugleiste über der Karte: Liedtext, Wunsch, Vibration */
  .tools { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px); display: flex; gap: 4px; padding: 5px; border-radius: 99px;
    background: rgba(10, 8, 20, 0.42); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    transform: translate(-50%, 260%); transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1); }
  body.on .tools { transform: translate(-50%, 0); }
  .tools button { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 15px; border-radius: 99px; border: 0; color: #fff; font: inherit; font-size: 13px; font-weight: 650;
    background: transparent; white-space: nowrap; transition: background 0.25s, transform 0.15s; }
  .tools button:active { transform: scale(0.95); }
  .tools button svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
  .tools button[aria-pressed="true"] { background: rgba(var(--a), 0.6); }
  .tools #bWish { background: rgb(var(--c)); color: #0b0a12; }
  .tools button[hidden] { display: none; }
  /* Liedtext zum Mitsingen: groß in der Mitte, die nächste Zeile klein darunter */
  .lyr { position: fixed; left: 20px; right: 20px; top: 50%; transform: translateY(-60%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
  body.on.lyrics .lyr.has { opacity: 1; }
  .lyr b { display: block; font-size: clamp(26px, 8.5vw, 46px); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.45); }
  .lyr span { display: block; margin-top: 14px; font-size: clamp(15px, 4.4vw, 21px); font-weight: 600; opacity: 0.55; }
  /* Songwünsche: Blatt von unten */
  /* über der Bildschirmtastatur: --kb = Tastaturhöhe, --vvh = sichtbare Höhe (visualViewport) */
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); max-height: calc(var(--vvh, 100dvh) - max(24px, env(safe-area-inset-top))); overflow: auto; overscroll-behavior: contain;
    padding: 0 16px max(18px, env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
    background: rgba(14, 12, 24, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.45); transform: translateY(105%); transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.2, 1), bottom 0.2s; }
  .sheet .top2 { position: sticky; top: 0; z-index: 1; padding: 10px 0 10px; background: linear-gradient(rgba(14, 12, 24, 1) 85%, rgba(14, 12, 24, 0)); }
  .sheet .grab { width: 40px; height: 4px; margin: 0 auto 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.25); }
  .sheet .shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet .x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; color: #fff; font: inherit; font-size: 15px; background: rgba(255, 255, 255, 0.1); }
  .sheet .field { position: relative; margin-top: 12px; }
  .sheet .field svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: rgba(255, 255, 255, 0.6); pointer-events: none; }
  .sheet .field input { padding-left: 42px; margin-bottom: 0; }
  .sheet .name { margin-top: 14px; }
  .sheet .name input { height: 40px; font-size: 15px; background: transparent; }
  body.wish .sheet { transform: none; }
  .sheet { z-index: 5; }
  body.wish .card, body.wish .tools, body.wish .lyr { opacity: 0 !important; pointer-events: none; }
  .sheet h2 { font-size: 20px; letter-spacing: -0.01em; }
  .sheet .hint { font-size: 13px; line-height: 1.45; opacity: 0.65; margin-top: 4px; }
  .sheet input { width: 100%; height: 46px; margin-bottom: 10px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.06);
    color: #fff; font: inherit; font-size: 16px; }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .send { flex: 1; height: 46px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700; color: #0b0a12; background: rgb(var(--c)); }
  .sheet .close { height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: transparent; color: #fff; font: inherit; }
  .sheet .msg { min-height: 20px; margin: 10px 0 4px; font-size: 13px; opacity: 0.8; }
  /* eine Spalte, die nie breiter als das Blatt wird (sonst schieben lange Titel die Zeile aus dem Bild) */
  .wl { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 8px; }
  .wl li { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); transition: background 0.2s, transform 0.15s; }
  .wl li:active { transform: scale(0.98); }
  .res li .go { color: #0b0a12; background: rgb(var(--c)); border: 0; min-width: 0; padding: 0 14px; font-size: 13px; }
  .wl li div { flex: 1; min-width: 0; }
  .wl b, .wl small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wl small { font-size: 12px; opacity: 0.6; }
  .wl button { flex: none; min-width: 58px; height: 34px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.16); background: transparent; color: #fff; font: inherit; font-weight: 700; }
  .wl button[aria-pressed="true"] { background: rgba(var(--a), 0.55); }
  .wl .ok { font-size: 12px; opacity: 0.8; }
  .wl img { flex: none; width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: rgba(255, 255, 255, 0.08); }
  .res li { cursor: pointer; }
  .res li.picked { background: rgba(var(--a), 0.4); }
  .sheet .sub { margin-top: 12px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
  .sheet .close { width: 100%; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { .orb, body.on .dot { animation: none; } }
  /* gesungenes Wort mit Wortbild: leuchtet kurz in dessen Farbe */
  .lyr .fxw { animation: fxw 2.6s ease-out both; }
  @keyframes fxw { 18% { text-shadow: 0 0 16px rgba(var(--fxc), 0.95), 0 0 46px rgba(var(--fxc), 0.6); } 100% { text-shadow: 0 0 12px rgba(var(--fxc), 0.25); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="brand"><span class="dot"></span>MIRAGE LIVE</div></div>
<div class="state"><div class="orb"></div><b id="sTitle"></b><p id="sText"></p></div>
<div class="tap" id="tap"></div>
<div class="lyr" id="lyr" aria-live="polite"><b id="ly"></b><span id="lyn"></span></div>
<div class="tools"><button type="button" id="bLyr" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg><span></span></button><button type="button" id="bWish" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.6a4 4 0 1 0 2 3.4V7h4V3z"/></svg><span></span></button><button type="button" id="bVib" aria-pressed="true" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v12h6V6zM3 8h2v8H3zm16 0h2v8h-2z"/></svg><span></span></button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="wTitle">
  <div class="top2"><div class="grab"></div><div class="shead"><h2 id="wTitle"></h2><button type="button" class="x" id="wClose">✕</button></div><p class="hint" id="wHint"></p>
    <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm5.2 9.8 4.5 4.5-1.4 1.4-4.5-4.5z"/></svg><input id="wSong" type="search" maxlength="80" enterkeyhint="search" autocomplete="off"></div></div>
  <ul class="wl res" id="wRes"></ul>
  <p class="msg" id="wMsg" aria-live="polite"></p>
  <div class="name"><input id="wName" maxlength="20" autocomplete="nickname"></div>
  <h3 class="sub" id="wNow"></h3><ul class="wl" id="wList"></ul></div>
<div class="card"><img class="cov" id="cov" alt="" hidden referrerpolicy="no-referrer" onerror="this.hidden=true"><div class="meta"><b id="title"></b><span id="artist"></span></div><div class="eq"><i></i><i></i><i></i></div><div class="bpm" id="bpm"></div></div>
<script>
// Kleinstmöglicher MQTT-3.1.1-Client über WebSocket: verbinden, abonnieren, Ping (wie in src/live.js)
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const te = new TextEncoder();
const mqStr = (s) => {
  const b = te.encode(s);
  return [b.length >> 8, b.length & 255, ...b];
};
const mqLen = (n) => {
  const o = [];
  do {
    let d = n % 128;
    n = Math.floor(n / 128);
    if (n) d |= 128;
    o.push(d);
  } while (n);
  return o;
};
const mqPkt = (h, body) => new Uint8Array([h, ...mqLen(body.length), ...body]);
function mqttOpen(url, { onReady, onMessage, onClose }) {
  const ws = new WebSocket(url, "mqtt");
  ws.binaryType = "arraybuffer";
  let buf = new Uint8Array(0), ping = 0;
  ws.onopen = () => ws.send(mqPkt(0x10, [...mqStr("MQTT"), 4, 2, 0, 60, ...mqStr("mirage-" + Math.random().toString(36).slice(2, 12))]));
  ws.onmessage = (e) => {
    const add = new Uint8Array(e.data), nb = new Uint8Array(buf.length + add.length);
    nb.set(buf);
    nb.set(add, buf.length);
    buf = nb;
    for (;;) {
      if (buf.length < 2) break;
      let len = 0, mul = 1, i = 1, b;
      do {
        if (i >= buf.length) return;
        b = buf[i++];
        len += (b & 127) * mul;
        mul *= 128;
      } while (b & 128);
      if (buf.length < i + len) break;
      const type = buf[0] >> 4, body = buf.subarray(i, i + len);
      buf = buf.slice(i + len);
      if (type === 2 && body[1] === 0) {
        ping = setInterval(() => ws.readyState === 1 && ws.send(new Uint8Array([0xc0, 0])), 30000);
        onReady?.(api);
      } else if (type === 3) onMessage?.(body.slice(2 + ((body[0] << 8) | body[1])));
    }
  };
  ws.onclose = ws.onerror = () => {
    clearInterval(ping);
    if (api.closed) return;
    api.closed = true;
    onClose?.();
  };
  const api = {
    closed: false,
    subscribe: (topic) => ws.readyState === 1 && ws.send(mqPkt(0x82, [0, 1, ...mqStr(topic), 0])),
    publish: (topic, payload) => ws.readyState === 1 && ws.send(mqPkt(0x30, [...mqStr(topic), ...payload])),
  };
  return api;
}

// Kanal und Schlüssel stehen nur hinter dem „#“ – dieser Teil wird nie an einen Server geschickt
const de = /^de/i.test(navigator.language || "");
const T = de
  ? { lyr: "Text", wish: "＋ Wunsch", vib: "Vibration", vibLv: ["aus", "sanft", "normal", "stark"], wTitle: "Song wünschen", wHint: "Mirage sucht ihn bei Spotify. Die anderen können abstimmen – wer die Musik macht, entscheidet.", wName: "Dein Name", opt: "optional", wSong: "Song bei Spotify suchen …", wSend: "Wünschen", wNow: "Gewünscht", wNone: "Nichts gefunden – anders schreiben?", wSearching: "Suche …", wSlow: "Noch keine Antwort – versuche es erneut …", wDead: "Mirage antwortet nicht. Läuft in Spotify der Party-Modus?", wErr: "Spotify hat gerade nicht geantwortet – gleich noch einmal versuchen.", vibTap: "Einmal antippen, damit das Handy vibrieren darf", wClose: "Schließen", wSent: "Gewünscht! Er erscheint gleich in der Liste.", wWait: "Kurz warten – ein Wunsch alle 45 Sekunden.", wQueued: "✓ in der Warteschlange", wEmpty: "Noch keine Wünsche – sei die erste Person!", wShort: "Bitte einen Titel eingeben.",
      tap: "Antippen für Vollbild · Display bleibt an", wait: ["Verbunden", "Warte auf den Party-Modus in Spotify …"], over: ["Party beendet", "Danke fürs Mitleuchten! Neue Party, neuer QR-Code."], bad: ["Link unvollständig", "Bitte den QR-Code noch einmal scannen."], net: ["Keine Verbindung", "Versuche es erneut … (WLAN oder mobile Daten an?)"], start: ["Mirage Live", "Verbinde …"] }
  : { lyr: "Lyrics", wish: "＋ Wish", vib: "Vibrate", vibLv: ["off", "gentle", "normal", "strong"], wTitle: "Wish for a song", wHint: "Mirage looks it up on Spotify. Others can vote – whoever runs the music decides.", wName: "Your name", opt: "optional", wSong: "Search Spotify …", wSend: "Wish", wNow: "Wished for", wNone: "Nothing found – try another spelling?", wSearching: "Searching …", wSlow: "No answer yet – trying again …", wDead: "Mirage isn't answering. Is party mode running in Spotify?", wErr: "Spotify didn't answer just now – try again in a moment.", vibTap: "Tap once so the phone may vibrate", wClose: "Close", wSent: "Sent! It shows up in the list in a moment.", wWait: "Hang on – one wish every 45 seconds.", wQueued: "✓ in the queue", wEmpty: "No wishes yet – be the first!", wShort: "Please enter a title.",
      tap: "Tap for full screen · screen stays on", wait: ["Connected", "Waiting for party mode in Spotify …"], over: ["Party's over", "Thanks for lighting up! New party, new QR code."], bad: ["Incomplete link", "Please scan the QR code again."], net: ["No connection", "Retrying … (is Wi-Fi or mobile data on?)"], start: ["Mirage Live", "Connecting …"] };
const $ = (id) => document.getElementById(id);
const say = ([a, b]) => {
  $("sTitle").textContent = a;
  $("sText").textContent = b;
};
$("tap").textContent = T.tap;
say(T.start);
const p = new URLSearchParams(location.hash.slice(1));
const fromB64 = (s) => Uint8Array.from(atob(String(s || "").replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
let skew = 0, lags = [];
// Vorlauf: keiner extra – das Theme läuft schon 40 ms vor (Bildschirm), das reicht auch für den Vibrationsmotor
const LEAD = 0;
let key = null, topic = "", cur = null, recvAt = 0, ended = false, pal = [[155, 107, 240], [34, 73, 231], [217, 188, 241]];
async function start() {
  try {
    const raw = fromB64(p.get("k")), ch = p.get("c") || "";
    if (raw.length !== 16 || !/^[\w-]{16,}$/.test(ch)) throw 0;
    key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt", "encrypt"]);
    topic = "mirage-live/" + ch;
  } catch {
    return say(T.bad);
  }
  // alle Relays zugleich abonnieren: das Theme sendet an den, der bei ihm erreichbar ist
  BROKERS.forEach(open);
}
const conns = new Set();
function open(url) {
  mqttOpen(url, {
    onReady: (c) => {
      conns.add(c);
      c.subscribe(topic);
      c.subscribe(topic + "/r/" + myId);
      if (!cur && !ended) say(T.wait);
    },
    onMessage: receive,
    onClose: () => {
      for (const c of conns) if (c.closed) conns.delete(c);
      if (!cur && !ended) say(T.net);
      setTimeout(() => open(url), 3000);
    },
  });
}
async function receive(m) {
  if (m.length < 29) return;
  let s;
  try {
    s = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: m.slice(0, 12) }, key, m.slice(12))));
  } catch {
    return; // nicht mit unserem Schlüssel verschlüsselt – ignorieren
  }
  if (Array.isArray(s.res)) return showResults(s); // Treffer unserer Suche
  if (cur && s.s < cur.s) return; // ältere Nachricht über den zweiten Relay
  // vom Relay aufbewahrte, alte Nachricht (z. B. Spotify wurde ohne Abmelden beendet): nicht als live zeigen
  if (s.on && Math.abs(Date.now() - s.s) > 60000) return;
  if (!s.on) {
    ended = true;
    cur = null;
    document.body.classList.remove("on");
    return say(T.over);
  }
  ended = false;
  cur = s;
  recvAt = performance.now();
  // Uhrenabgleich: Laufzeit über den Relay schwankt (50–500 ms). Die kürzeste gemessene „Ankunft minus
  // Sendezeit“ der letzten 20 s ist die beste Schätzung für den Uhrenunterschied PC ↔ Handy – damit rechnet
  // das Handy den Takt ab der SENDEZEIT weiter statt ab der (verspäteten) Ankunft.
  const lag = Date.now() - s.s, at = performance.now();
  lags.push([at, lag]);
  while (lags.length && at - lags[0][0] > 20000) lags.shift();
  skew = Math.min(...lags.map((x) => x[1]));
  if (Array.isArray(s.pal) && s.pal.length === 3) {
    pal = s.pal;
    s.pal.forEach((c, i) => document.documentElement.style.setProperty(["--a", "--b", "--c"][i], c.join(",")));
  }
  $("title").textContent = s.t || "";
  const img = /^https:\/\/i\.scdn\.co\/image\/[\w]+$/.test(s.img || "") ? s.img : "";
  if ($("cov").getAttribute("src") !== img) img ? ($("cov").src = img) : $("cov").removeAttribute("src");
  $("cov").hidden = !img;
  $("artist").textContent = s.a || "";
  $("bpm").textContent = s.bpm ? s.bpm + " BPM" : "";
  // Liedtext: aktuelle Zeile groß, nächste klein
  if ($("ly").textContent !== (s.ly || "")) $("ly").textContent = s.ly || "";
  if ($("lyn").textContent !== (s.lyn || "")) $("lyn").textContent = s.lyn || "";
  $("lyr").classList.toggle("has", !!s.ly);
  // Wortbild vom PC: einmal abspielen, das Wort in der Zeile aufleuchten lassen
  if (s.fx && s.fx.s !== lastFxAt && Date.now() - skew - s.fx.s < 3500) {
    lastFxAt = s.fx.s;
    wordFx(s.fx);
  }
  // Songwünsche: nur wenn der Gastgeber sie erlaubt
  $("bWish").hidden = !Array.isArray(s.w);
  if (Array.isArray(s.w)) drawWishes(s.w);
  document.body.classList.add("on");
}

/* ---- Songwünsche und Abstimmung: verschlüsselt zurück an Mirage (Unterkanal „/in“) */
const store = (k, v) => {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch {}
  return v;
};
const myId = store("mlId") || store("mlId", Math.random().toString(36).slice(2, 14));
const voted = new Set();
let lastWish = 0, wishKey = "";
async function sendUp(obj) {
  if (!key || !conns.size) return false;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify({ v: 1, id: myId, s: Date.now(), ...obj }))));
  const out = new Uint8Array(12 + ct.length);
  out.set(iv);
  out.set(ct, 12);
  for (const c of conns) c.publish(topic + "/in", out);
  return true;
}
function drawWishes(list) {
  const k = JSON.stringify(list);
  if (k === wishKey) return;
  wishKey = k;
  $("wList").replaceChildren(...(list.length ? list : [null]).map((w) => {
    const li = document.createElement("li");
    if (!w) {
      li.textContent = T.wEmpty;
      return li;
    }
    li.append(...songRow(w, w.n));
    if (w.st === "queued") {
      const ok = document.createElement("span");
      ok.className = "ok";
      ok.textContent = T.wQueued;
      li.append(ok);
    } else {
      const v = document.createElement("button");
      v.type = "button";
      v.textContent = "👍 " + w.v;
      v.setAttribute("aria-pressed", String(voted.has(w.i)));
      v.onclick = () => {
        if (voted.has(w.i)) return;
        voted.add(w.i);
        v.setAttribute("aria-pressed", "true");
        v.textContent = "👍 " + (w.v + 1);
        sendUp({ k: "vote", w: w.i });
      };
      li.append(v);
    }
    return li;
  }));
}
// eine Zeile: Cover, Titel, Interpret (Cover nur von Spotifys Bildserver)
function songRow(w, by) {
  const out = [];
  if (/^https:\/\/i\.scdn\.co\//.test(w.img || "")) {
    const im = new Image();
    im.alt = "";
    im.loading = "lazy";
    im.referrerPolicy = "no-referrer";
    im.onerror = () => (im.style.visibility = "hidden");
    im.src = w.img;
    out.push(im);
  }
  const d = document.createElement("div"), b = document.createElement("b"), sm = document.createElement("small");
  b.textContent = w.t;
  sm.textContent = w.a + (by ? " · " + by : "");
  d.append(b, sm);
  out.push(d);
  return out;
}
$("wName").value = store("mlName") || "";
// Suche im Spotify-Katalog: kurz nach dem Tippen fragen, nur die Antwort auf die letzte Frage zählt
let rid = 0, searchT = 0, waitT = 0, lastQ = "";
const hits = new Map();
async function ask(q, tries) {
  const r = ++rid;
  clearTimeout(waitT);
  if (!(await sendUp({ k: "search", q, r }))) return ($("wMsg").textContent = T.net[1]);
  // kommt in 6 s nichts (Relay hat die Nachricht verloren, Spotify hängt): einmal neu fragen, dann ehrlich sagen
  waitT = setTimeout(() => {
    if (r !== rid) return;
    if (tries < 1) {
      $("wMsg").textContent = T.wSlow;
      ask(q, tries + 1);
    } else $("wMsg").textContent = T.wDead;
  }, 6000);
}
$("wSong").oninput = () => {
  clearTimeout(searchT);
  const q = $("wSong").value.trim();
  if (q.length < 2) {
    $("wRes").replaceChildren();
    $("wMsg").textContent = "";
    clearTimeout(waitT);
    rid++;
    return;
  }
  // schon einmal gesucht: sofort zeigen
  if (hits.has(q.toLowerCase())) return showResults({ r: rid, res: hits.get(q.toLowerCase()), cached: true });
  // alte Treffer sofort weg – sonst sieht man während der neuen Suche noch die Ergebnisse von eben
  $("wRes").replaceChildren();
  $("wMsg").textContent = T.wSearching;
  searchT = setTimeout(() => {
    lastQ = q;
    ask(q, 0);
  }, 250);
};
function showResults(s) {
  if (s.r !== rid) return;
  clearTimeout(waitT);
  if (!s.cached && !s.err && lastQ) hits.set(lastQ.toLowerCase(), s.res);
  if (hits.size > 40) hits.delete(hits.keys().next().value);
  $("wMsg").textContent = s.err ? T.wErr : s.res.length ? "" : T.wNone;
  $("wRes").replaceChildren(...s.res.map((w) => {
    const li = document.createElement("li");
    li.append(...songRow(w));
    const go = document.createElement("button");
    go.type = "button";
    go.textContent = T.wSend;
    go.className = "go";
    const pick = () => wish(w, li);
    go.onclick = (e) => {
      e.stopPropagation();
      pick();
    };
    li.onclick = pick;
    li.append(go);
    return li;
  }));
}
async function wish(w, li) {
  if (Date.now() - lastWish < 45000) return ($("wMsg").textContent = T.wWait);
  const n = $("wName").value.trim();
  if (!(await sendUp({ k: "wish", i: w.i, n }))) return ($("wMsg").textContent = T.net[1]);
  lastWish = Date.now();
  store("mlName", n);
  li.classList.add("picked");
  $("wMsg").textContent = T.wSent;
  setTimeout(() => {
    $("wRes").replaceChildren();
    $("wSong").value = "";
  }, 900);
}
$("bWish").onclick = (e) => {
  e.stopPropagation();
  document.body.classList.add("wish");
  $("wMsg").textContent = "";
};
$("wClose").onclick = (e) => {
  e.stopPropagation();
  document.body.classList.remove("wish");
};
$("sheet").addEventListener("click", (e) => e.stopPropagation());

/* ---- Liedtext und Vibration an/aus (bleibt gespeichert) */
const flag = (k, def) => (store(k) ?? (def ? "1" : "0")) === "1";
let showLyr = flag("mlLyr", true);
// Vibrationsstufe 0 aus · 1 sanft · 2 normal · 3 stark (früher nur an/aus: „aus“ bleibt aus)
let vibLvl = navigator.vibrate ? Math.max(0, Math.min(3, Number(store("mlVibLvl") ?? (flag("mlVib", true) ? 2 : 0)) || 0)) : 0;
const syncTools = () => {
  $("bLyr").setAttribute("aria-pressed", String(showLyr));
  $("bVib").setAttribute("aria-pressed", String(vibLvl > 0));
  $("bVib").querySelector("span").textContent = T.vibLv[vibLvl];
  $("bVib").title = $("bVib").ariaLabel = `${T.vib}: ${T.vibLv[vibLvl]}`;
  document.body.classList.toggle("lyrics", showLyr);
};
$("bLyr").querySelector("span").textContent = T.lyr;
$("bWish").querySelector("span").textContent = T.wish.replace(/^\uff0b\s*/, "");
$("bVib").hidden = !navigator.vibrate;
$("wTitle").textContent = T.wTitle;
$("wHint").textContent = T.wHint;

$("wSong").placeholder = T.wSong;
$("wNow").textContent = T.wNow;
$("wClose").title = $("wClose").ariaLabel = T.wClose;
$("wName").placeholder = T.wName + " (" + T.opt + ")";
// Tastatur: Höhe der Tastatur und sichtbare Höhe messen – das Wunsch-Blatt bleibt immer darüber
const vv = window.visualViewport;
const fitKb = () => {
  const h = vv ? vv.height : innerHeight, kb = vv ? Math.max(0, innerHeight - vv.height - vv.offsetTop) : 0;
  document.documentElement.style.setProperty("--kb", Math.round(kb) + "px");
  document.documentElement.style.setProperty("--vvh", Math.round(h) + "px");
};
vv?.addEventListener("resize", fitKb);
vv?.addEventListener("scroll", fitKb);
addEventListener("resize", fitKb);
fitKb();
for (const id of ["wSong", "wName"]) $(id).addEventListener("focus", () => setTimeout(() => $(id).scrollIntoView({ block: "nearest", behavior: "smooth" }), 320));
$("bLyr").onclick = (e) => {
  e.stopPropagation();
  showLyr = !showLyr;
  store("mlLyr", showLyr ? "1" : "0");
  syncTools();
};
// Antippen schaltet weiter: aus → sanft → normal → stark → aus; jede Stufe spürt man gleich zur Probe
$("bVib").onclick = (e) => {
  e.stopPropagation();
  vibLvl = (vibLvl + 1) % 4;
  store("mlVibLvl", String(vibLvl));
  haptic([[0.5, 70], [0, 90], [1, 120]]);
  syncTools();
};
syncTools();
// Android-Chrome lässt erst vibrieren, wenn die Seite einmal angetippt wurde – bis dahin darum bitten
const canBuzz = () => !navigator.userActivation || navigator.userActivation.hasBeenActive;
/* ---- Haptik */
// Websites dürfen den Motor nur „X ms an, Y ms aus“ schalten – eine Stärke gibt es im Browser nicht (nur Apps
// haben sie). Stärke entsteht deshalb wie beim Dimmen einer LED: in 16-ms-Zeitscheiben nur einen Teil „an“.
// Alles läuft durch haptic(); bekommen Browser einmal eine echte Stärke-Schnittstelle, ändert sich nur das hier.
const SLICE = 16, LV_GAIN = [0, 0.6, 0.85, 1], LV_LEN = [0, 0.8, 1, 1.25];
function haptic(parts) {
  if (!vibLvl || !navigator.vibrate) return;
  if (!canBuzz()) return void document.body.classList.add("needvib");
  try { navigator.vibrate(hapticPattern(parts, vibLvl)); } catch {}
}
// [[Stärke 0..1, ms], …] → Vibrationsmuster [an, aus, an, …] in ms
function hapticPattern(parts, lvl) {
  const seg = []; // [an?, ms]
  for (const [strength, ms0] of parts) {
    const ms = Math.round(ms0 * (strength > 0 ? LV_LEN[lvl] : 1));
    const st = Math.min(1, strength * LV_GAIN[lvl]);
    if (ms <= 0) continue;
    if (st <= 0) seg.push([false, ms]);
    else if (st >= 0.92) seg.push([true, ms]);
    else {
      // gedimmt: je Zeitscheibe st·16 ms an (mindestens 5 ms – kürzer spürt kaum ein Motor)
      const on = Math.max(5, Math.round(SLICE * st));
      for (let t = 0; t < ms; t += SLICE) {
        const a = Math.min(on, ms - t);
        // ein Rest unter 5 ms am Ende wäre nicht zu spüren – dann lieber Pause
        if (a >= 5) seg.push([true, a], [false, Math.max(0, Math.min(SLICE - on, ms - t - on))]);
        else seg.push([false, ms - t]);
      }
    }
  }
  // zu einem Muster an/aus/an/… zusammenfassen (beginnt immer mit „an“)
  const pat = [];
  for (const [on, ms] of seg) {
    if (!ms) continue;
    const wantOn = pat.length % 2 === 0;
    if (on === wantOn) pat.push(ms);
    else if (pat.length) pat[pat.length - 1] += ms;
    else pat.push(0, ms);
  }
  if (pat.length % 2 === 0) pat.pop();
  return pat;
}
const clamp01 = (v) => Math.max(0, Math.min(1, v));
// je Schlag ein Muster, das zum Song passt: Eins kräftig, Backbeat ein leichter Tap, im Aufbau dichter
// werdende Ticks, ruhige Stellen gar nichts. Ein Muster ist immer kürzer als der Schlag (keine Überlappung).
function beatParts(beat, c) {
  const bl = 60000 / (c.bpm || 120), e = c.e || 0, b = c.b || 0, inBar = ((beat % 4) + 4) % 4;
  if (b > 0.25 && (c.d || 0) < 0.3) {
    const n = b > 0.7 ? 4 : 2, on = 14 + 10 * b, gap = bl / n - on, parts = [];
    for (let i = 0; i < n; i++) parts.push([0.35 + 0.6 * b, on], [0, gap]);
    parts.pop();
    return parts;
  }
  if (e < 0.3) return null;
  if (inBar === 0) return [[clamp01(0.45 + 0.55 * e), Math.min(bl * 0.7, 35 + 45 * e)]];
  if ((inBar === 1 || inBar === 3) && e > 0.5) return [[0.3 + 0.35 * e, 18]];
  if (inBar === 2 && e > 0.65) return [[0.5 + 0.3 * e, 26]];
  return null;
}
function hapticBeat(beat, c) {
  const p = beatParts(beat, c);
  if (p) haptic(p);
}
addEventListener("pointerdown", () => {
  if (!document.body.classList.contains("needvib")) return;
  document.body.classList.remove("needvib");
  haptic([[0.8, 40]]);
  $("tap").textContent = T.tap;
}, true);
new MutationObserver(() => {
  if (document.body.classList.contains("needvib")) $("tap").textContent = T.vibTap;
}).observe(document.body, { attributes: true, attributeFilter: ["class"] });

/* ---- Licht: Canvas */
const cv = $("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
function size() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = cv.width = Math.round(innerWidth * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
}
addEventListener("resize", size);
size();
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
const lerp = (a, b, f) => a + (b - a) * f;
const show = { lit: 0, e: 0, kick: 0, drop: 0, flash: 0, beat: -1, rings: [], eq: [0, 0, 0] };
const bars = [...document.querySelectorAll(".eq i")];
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const age = cur ? (now - recvAt) / 1000 : 99;
  const live = cur && age < 4;
  if (cur && !live) {
    document.body.classList.remove("on");
    if (!ended) say(T.wait);
  }
  // den Takt aus Tempo und Schlagphase selbst weiterrechnen – flüssig, auch wenn Nachrichten zittern
  let kick = 0;
  if (live) {
    // Zeit seit dem Senden (nicht seit der Ankunft) – so sitzen Ringe und Vibration auf dem Songbeat
    const since = Math.max(0, (Date.now() - cur.s - skew) / 1000) + LEAD;
    const bp = (cur.bi >= 0 ? cur.bi + cur.ph : 0) + since * (cur.bpm / 60);
    const beat = Math.floor(bp), f = bp - beat;
    kick = Math.exp(-f * 6) * (0.35 + 0.65 * cur.e);
    if (beat !== show.beat) {
      if (show.beat >= 0) show.rings.push({ r: 0, a: 0.5 + cur.e * 0.4, c: pal[beat % 3], w: beat % 4 === 0 ? 2.4 : 1.4 });
      // Vibration im Takt (Stärke und Muster je Musikteil, siehe beatParts)
      if (show.beat >= 0) hapticBeat(beat, cur);
      show.beat = beat;
    }
    const d = Math.max(0, cur.d - age * 0.6);
    if (d > 0.85 && show.drop < 0.5) {
      show.flash = 1;
      // Drop: von sanft zu voll anschwellen, dann lang (Android; iPhones lassen Websites nicht vibrieren)
      haptic([[0.45, 45], [0.7, 45], [0.9, 45], [1, 260]]);
      show.rings.push({ r: 0, a: 1, c: [255, 255, 255], w: 5 });
    }
    show.drop = d;
  }
  show.lit = lerp(show.lit, live ? 1 : 0.18, 1 - Math.exp(-dt * 2));
  show.e = lerp(show.e, live ? cur.e : 0.3, 1 - Math.exp(-dt * 3));
  show.kick = kick > show.kick ? kick : lerp(show.kick, kick, 1 - Math.exp(-dt * 10));
  const t = now / 1000, m = Math.max(W, H);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#06050b";
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  // drei Lichtquellen treiben langsam durchs Bild und atmen mit der Kick
  for (let i = 0; i < 3; i++) {
    const x = W * (0.5 + 0.32 * Math.sin(t * (0.11 + i * 0.04) + i * 2.1));
    const y = H * (0.45 + 0.3 * Math.cos(t * (0.09 + i * 0.05) + i * 1.3));
    const r = m * (0.45 + 0.12 * show.e) * (1 + show.kick * 0.12);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = show.lit * (0.32 + show.e * 0.3 + show.kick * 0.22);
    g.addColorStop(0, rgba(pal[i], a));
    g.addColorStop(0.55, rgba(pal[i], a * 0.35));
    g.addColorStop(1, rgba(pal[i], 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // Mitte: weiches Leuchten auf jedem Schlag
  const cx = W / 2, cy = H * 0.45;
  const gc = ctx.createRadialGradient(cx, cy, 0, cx, cy, m * 0.35);
  gc.addColorStop(0, rgba([255, 255, 255], show.lit * show.kick * 0.35));
  gc.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gc;
  ctx.fillRect(0, 0, W, H);
  // Ringe laufen auf jedem Schlag nach außen, auf der Eins kräftiger, beim Drop ein weißer Schockring
  show.rings = show.rings.filter((g) => (g.a *= Math.exp(-dt * 1.6)) > 0.02);
  for (const g of show.rings) {
    g.r += dt * m * (0.5 + show.e * 0.4);
    ctx.lineWidth = g.w * dpr * (1 + g.r / m);
    ctx.strokeStyle = rgba(g.c, g.a * 0.7);
    ctx.beginPath();
    ctx.arc(cx, cy, g.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Wortbilder (fx.js): dieselben Bilder wie im Party-Modus
  if (wfx) {
    if (!covR || ++covN % 30 === 0) {
      const r = $("cov").hidden ? null : $("cov").getBoundingClientRect();
      covR = r && r.width ? { cx: (r.left + r.width / 2) * dpr, cy: (r.top + r.height / 2) * dpr, R: (r.width / 2) * dpr } : { cx: W / 2, cy: H * 0.45, R: Math.min(W, H) * 0.12 };
    }
    fxSt = { now, pos: 0, dt, w: W, h: H, dpr, cx: covR.cx, cy: covR.cy, R: covR.R, pal, level: 2, beat: show.kick, beatIdx: show.beat, playing: true };
    wfx.draw(ctx, fxSt);
  }
  // Blitz beim Drop
  if (show.flash > 0.01) {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = rgba([255, 255, 255], show.flash * 0.85);
    ctx.fillRect(0, 0, W, H);
    show.flash *= Math.exp(-dt * 6);
  }
  // kleiner Equalizer in der Karte
  show.eq = show.eq.map((v, i) => lerp(v, live ? Math.min(1, show.kick * (0.7 + 0.3 * Math.sin(t * 9 + i * 2)) + show.e * 0.35) : 0.15, 0.35));
  bars.forEach((b, i) => (b.style.height = Math.round(25 + show.eq[i] * 75) + "%"));
  document.body.classList.toggle("loud", live && cur.e > 0.6);
}
requestAnimationFrame(frame);

/* ---- Wortbilder (wie im Party-Modus, der PC schickt mit, welches Wort gerade ein Bild hat) */
let wfx = null, fxSt = null, covR = null, covN = 0, lastFxAt = 0;
addEventListener("load", () => {
  try { wfx = window.MirageFx?.create() || null; } catch {}
});
addEventListener("resize", () => (covR = null));
function wordFx(f) {
  if (!wfx || !fxSt) return;
  wfx.fire(f.c, fxSt);
  const w = String(f.w || ""), line = $("ly").textContent, at = w ? line.toLocaleLowerCase().indexOf(w.toLocaleLowerCase()) : -1;
  if (at < 0) return;
  const col = window.MirageFx.glowOf(f.c) || pal[0];
  const sp = document.createElement("span");
  sp.className = "fxw";
  sp.style.setProperty("--fxc", col.join(","));
  sp.textContent = line.slice(at, at + w.length);
  $("ly").replaceChildren(line.slice(0, at), sp, line.slice(at + w.length));
}

// Antippen: Vollbild und Display anlassen
let lock = null;
document.addEventListener("click", async () => {
  document.body.classList.add("armed");
  document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
  try {
    lock = await navigator.wakeLock?.request("screen");
  } catch {}
});
document.addEventListener("visibilitychange", async () => {
  if (lock && document.visibilityState === "visible") lock = await navigator.wakeLock?.request("screen").catch(() => null);
});
start();
