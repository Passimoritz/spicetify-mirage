# Vorlage, noch NICHT aktiv: als weiteren Job unter "jobs:" in .github/workflows/ci.yml einfügen.
# Prüft die Handy-Seite (docs/live/) in WebKit – der Technik hinter Safari auf dem iPhone – und in Chrome.
# Playwright wird nur hier installiert (--no-save): lokal bleibt "npm run test:phones" ohne das Paket lauffähig
# und überspringt den WebKit-Teil mit einem Hinweis.
  phones:
    name: Phone page in WebKit and Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # fx.js und qr.js der Handy-Seite frisch bauen, damit der Test den aktuellen Stand sieht
      - name: Build
        run: npm run build

      # WebKit samt Systembibliotheken; die Version festhalten, damit ein Playwright-Update den Test nicht still ändert
      - name: Install Playwright with WebKit
        run: |
          npm install --no-save playwright@1.49
          npx playwright install --with-deps webkit

      # Chrome ist auf ubuntu-latest vorinstalliert (/usr/bin/google-chrome); --need-webkit macht fehlendes WebKit zum Fehler
      - name: Test the phone page
        run: npm run test:phones -- --need-webkit
