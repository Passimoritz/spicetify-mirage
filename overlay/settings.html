<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Mirage Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #07060c; --text: #f5f3ff; --sub: #b9b4cc; --line: rgba(255,255,255,.08); --glass: rgba(255,255,255,.04);
    --a: #b69cff; --b: #7c5cff; --c: #e6deff;
    --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
    --font: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(40% 35% at 15% 10%, color-mix(in srgb, var(--a) 35%, transparent), transparent 70%),
                radial-gradient(35% 40% at 90% 30%, color-mix(in srgb, var(--b) 30%, transparent), transparent 70%),
                radial-gradient(45% 35% at 50% 100%, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%);
    filter: blur(30px); animation: drift 26s var(--ease) infinite alternate; }
  @keyframes drift { to { transform: translate(3%, 2%) rotate(4deg) scale(1.08); } }
  header { position: sticky; top: 0; z-index: 5; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 160px 0 20px;
           -webkit-app-region: drag; background: rgba(7,6,12,.6); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
  header .logo { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--a); box-shadow: 0 0 14px var(--a); }
  header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub);
            padding: 5px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); -webkit-app-region: no-drag; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #ff6b81; box-shadow: 0 0 10px #ff6b81; }
  .status.on i { background: #5cf2b0; box-shadow: 0 0 10px #5cf2b0; animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  main { max-width: 820px; margin: 0 auto; padding: 22px 22px 120px; display: grid; gap: 18px; }

  .now { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); }
  .now img, .now .ph { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: linear-gradient(135deg, var(--c), var(--a), var(--b)); flex: none; }
  .now .k { font: 500 10px var(--mono); letter-spacing: .26em; text-transform: uppercase; color: var(--c); }
  .now b { display: block; font-size: 18px; margin-top: 4px; }
  .now span { color: var(--sub); }
  .now button { margin-left: auto; }

  section { padding: 20px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); }
  section > h2 { margin: 0 0 16px; font: 500 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--c); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .row > div:first-child { min-width: 0; }
  .row b { display: block; font-weight: 600; }
  .row small { color: var(--sub); }

  .seg { display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 2px; border-radius: 99px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; color: var(--sub); font: 600 13px var(--font); padding: 8px 14px; border-radius: 99px; cursor: pointer; transition: all .35s var(--spring); }
  .seg button[aria-pressed="true"] { color: #0b0a12; background: linear-gradient(135deg, var(--c), var(--a)); box-shadow: 0 6px 20px -6px var(--a); }

  .toggle { appearance: none; width: 46px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.16); position: relative; cursor: pointer; flex: none; transition: background .3s; margin: 0; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .35s var(--spring); }
  .toggle:checked { background: linear-gradient(135deg, var(--c), var(--a)); }
  .toggle:checked::after { transform: translateX(20px); }
  input[type=range] { accent-color: var(--a); width: 200px; }
  input[type=time] { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font: 14px var(--font); color-scheme: dark; }
  .val { font: 500 12px var(--mono); color: var(--sub); min-width: 52px; text-align: right; display: inline-block; }
  :focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

  /* Bildschirmkarte */
  .screens { position: relative; height: 170px; margin: 6px 0 14px; }
  .screen { position: absolute; display: grid; place-items: center; border-radius: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.05); color: var(--sub); font: 700 22px var(--font); transition: all .35s var(--spring); }
  .screen small { position: absolute; bottom: 6px; font: 500 10px var(--mono); }
  .screen:hover { background: rgba(255,255,255,.1); }
  .screen[aria-pressed="true"] { color: #0b0a12; border-color: transparent; background: linear-gradient(135deg, var(--c), var(--a)); box-shadow: 0 14px 40px -12px var(--a); }
  .screen[aria-pressed="true"] small { color: rgba(11,10,18,.7); }

  /* Positions-Raster */
  .grid9 { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 24px); gap: 5px; padding: 8px; border-radius: 12px;
           background: rgba(255,255,255,.04); border: 1px solid var(--line); }
  .grid9 button { border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: rgba(255,255,255,.04); cursor: pointer; transition: all .3s var(--spring); }
  .grid9 button:hover { background: rgba(255,255,255,.12); }
  .grid9 button[aria-pressed="true"] { background: linear-gradient(135deg, var(--c), var(--a)); border-color: transparent; transform: scale(1.08); }

  /* Stil-Karten */
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sty { border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.03); padding: 14px 10px 10px; cursor: pointer; color: var(--sub);
         font: 600 13px var(--font); display: grid; gap: 10px; justify-items: center; transition: all .35s var(--spring); }
  .sty:hover { transform: translateY(-2px); background: rgba(255,255,255,.07); }
  .sty[aria-pressed="true"] { color: var(--text); border-color: var(--a); box-shadow: 0 12px 30px -14px var(--a), inset 0 0 0 1px var(--a); }
  .mini { height: 40px; width: 100%; display: grid; place-items: center; }
  .mini .island { width: 92px; height: 26px; border-radius: 99px; background: #000; display: flex; align-items: center; gap: 6px; padding: 0 4px; box-shadow: 0 6px 16px -6px var(--a); }
  .mini .dot { width: 18px; height: 18px; border-radius: 6px; background: linear-gradient(135deg, var(--c), var(--a), var(--b)); flex: none; }
  .mini .ln { height: 5px; border-radius: 3px; background: rgba(255,255,255,.5); flex: 1; }
  .mini .card { width: 96px; height: 38px; border-radius: 10px; background: linear-gradient(120deg, #251d3a, #120f1d); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; gap: 6px; padding: 0 6px; }
  .mini .card .dot { width: 26px; height: 26px; }
  .mini .banner { width: 100%; height: 26px; border-radius: 7px; background: #120f1d; border-top: 2px solid var(--a); display: flex; align-items: center; gap: 6px; padding-right: 6px; overflow: hidden; }
  .mini .banner .dot { width: 26px; height: 26px; border-radius: 0; }
  .mini .minimal { font: 800 13px var(--font); color: #fff; text-shadow: 0 0 12px var(--a); }
  .mini .lyrics { width: 100px; height: 34px; border-radius: 10px; background: linear-gradient(120deg, #251d3a, #120f1d); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; gap: 6px; padding: 0 6px; }
  .mini .lyrics .dot { width: 22px; height: 22px; }
  .mini .lyrics .lns { flex: 1; display: grid; gap: 4px; }
  .mini .lyrics .ln:first-child { height: 6px; background: #fff; box-shadow: 0 0 8px var(--a); }
  .mini .lyrics .ln:last-child { width: 70%; background: rgba(255,255,255,.3); }
  .mini .viz { width: 70px; height: 24px; border-radius: 99px; background: #000; display: flex; align-items: center; gap: 3px; padding: 0 6px 0 3px; box-shadow: 0 6px 16px -6px var(--a); }
  .mini .viz .dot { width: 18px; height: 18px; border-radius: 50%; margin-right: 3px; }
  .mini .viz i { width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(to top, var(--b), var(--a), var(--c)); animation: vz 1s ease-in-out infinite alternate; }
  .mini .viz i:nth-child(odd) { animation-delay: -.4s; } .mini .viz i:nth-child(3n) { animation-delay: -.7s; }
  @keyframes vz { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .mini .strip { align-self: end; width: 100%; height: 14px; border-radius: 4px; display: flex; align-items: center; gap: 5px; padding: 0 4px 0 2px; position: relative; overflow: hidden;
                 background: linear-gradient(90deg, color-mix(in srgb, var(--b) 45%, #120f1d), #120f1d 60%, color-mix(in srgb, var(--a) 30%, #120f1d)); border-top: 1px solid rgba(255,255,255,.3); }
  .mini .strip .dot { width: 10px; height: 10px; border-radius: 3px; }
  .mini .strip .ln { height: 3px; }
  .mini .strip::after { content: ""; position: absolute; left: 0; bottom: 0; width: 45%; height: 1px; background: var(--a); }
  .mini .bubble { display: flex; align-items: center; }
  .mini .bubble .dot { width: 30px; height: 30px; border-radius: 50%; position: relative; z-index: 1; box-shadow: 0 0 0 2px var(--a); animation: bub 2.8s ease-out infinite; }
  .mini .bubble .ln { width: 52px; height: 16px; margin-left: -14px; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--b) 55%, #120f1d), #1c1630); border: 1px solid rgba(255,255,255,.14); }
  @keyframes bub { from { box-shadow: 0 0 0 2px var(--a), 0 0 0 0 var(--a); } to { box-shadow: 0 0 0 2px var(--a), 0 0 0 8px transparent; } }
  .move { display: flex; gap: 10px; flex: none; }
  .styleHint { margin: 10px 2px 0; color: var(--sub); font-size: 13px; min-height: 1.45em; }
  /* macOS: Ampelknöpfe links, keine eingeblendeten Fensterknöpfe rechts */
  .mac header { padding: 0 20px 0 84px; }

  .btn { border: 0; border-radius: 99px; padding: 11px 20px; font: 700 14px var(--font); cursor: pointer; color: #0b0a12;
         background: linear-gradient(135deg, var(--c), var(--a) 60%, var(--b)); box-shadow: 0 12px 30px -10px var(--a); transition: transform .35s var(--spring); }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  .fab { position: fixed; right: 24px; bottom: 22px; z-index: 6; }
  .hidden { display: none !important; }
  .row[hidden] { display: none; }
  .row .btn { flex: none; padding: 8px 16px; font-size: 13px; box-shadow: none; }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .lhint { margin: -4px 0 10px; font-size: 13px; opacity: 0.7; }
  .lrow { gap: 8px; justify-content: flex-start; }
  .lrow input[type="text"], .lrow input[type="number"], .lrow select { height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); color: inherit; font: inherit; }
  .lrow input[type="text"] { flex: 1; min-width: 0; }
  .lrow input[type="number"] { width: 84px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chips label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--glass); font-size: 13px; cursor: pointer; }
  .chips label.room { font-weight: 700; }
  .chips input { accent-color: var(--a); margin: 0; }
  .chips:empty { display: none; }
  .calDot { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .calDot.on { background: #fff; box-shadow: 0 0 20px #fff; }
  .hist { display: grid; gap: 6px; margin-top: 4px; }
  .hist button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: 12px; background: var(--glass); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .hist button:hover { background: var(--line); }
  .hist img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
  .hist span { min-width: 0; display: grid; }
  .hist b, .hist small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist small { opacity: 0.65; }
  .obsUrl code { font: 500 13px var(--mono); color: var(--c); user-select: all; padding: 6px 10px; border-radius: 8px; background: var(--glass); border: 1px solid var(--line); }
  @media (max-width: 720px) { .styles { grid-template-columns: repeat(2, 1fr); } .row { flex-wrap: wrap; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header>
  <span class="logo" aria-hidden="true"></span>
  <h1 data-t="title"></h1>
  <span class="status" id="status"><i></i><span id="statusText"></span></span>
</header>
<main>
  <div class="now" id="now">
    <div class="ph" id="nowImgPh"></div><img id="nowImg" class="hidden" alt="">
    <div><div class="k" data-t="nowPlaying"></div><b id="nowTitle">—</b><span id="nowArtist"></span></div>
    <button class="btn" id="previewBtn" data-t="preview"></button>
  </div>

  <section>
    <h2 data-t="secWhen"></h2>
    <div class="row"><div><b data-t="mode"></b></div>
      <div class="seg" data-key="mode">
        <button data-v="song" data-t="modeSong"></button><button data-v="always" data-t="modeAlways"></button><button data-v="off" data-t="modeOff"></button>
      </div></div>
    <div class="row"><div><b data-t="duration"></b></div>
      <div><input type="range" min="2" max="20" step="1" data-key="duration"><span class="val" data-unit="s" data-for="duration"></span></div></div>
    <div class="row"><div><b data-t="onPlayPause"></b><small data-t="onPlayPauseHint"></small></div><input type="checkbox" class="toggle" data-key="onPlayPause"></div>
    <div class="row"><div><b data-t="quiet"></b><small data-t="quietHint"></small></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span data-t="from"></span><input type="time" data-key="quietFrom"><span data-t="to"></span><input type="time" data-key="quietTo">
        <input type="checkbox" class="toggle" data-key="quietOn">
      </div></div>
  </section>

  <section>
    <h2 data-t="secWhere"></h2>
    <div class="row"><div><b data-t="screen"></b></div>
      <div class="seg" data-key="display" id="displayModes">
        <button data-v="primary" data-t="primary"></button><button data-v="cursor" data-t="cursor"></button>
      </div></div>
    <div class="screens" id="screens"></div>
    <div class="row"><div><b data-t="position"></b></div><div class="grid9" id="grid9"></div></div>
    <div class="row"><div><b data-t="offset"></b></div>
      <div style="display:grid;gap:6px">
        <div>↔ <input type="range" min="-400" max="400" step="2" data-key="offsetX"><span class="val" data-unit="px" data-for="offsetX"></span></div>
        <div>↕ <input type="range" min="0" max="400" step="2" data-key="offsetY"><span class="val" data-unit="px" data-for="offsetY"></span></div>
      </div></div>
  </section>

  <section>
    <h2 data-t="secLook"></h2>
    <div class="styles" data-key="style">
      <button class="sty" data-v="island"><span class="mini"><span class="island"><span class="dot"></span><span class="ln"></span></span></span><span data-t="stIsland"></span></button>
      <button class="sty" data-v="card"><span class="mini"><span class="card"><span class="dot"></span><span class="ln"></span></span></span><span data-t="stCard"></span></button>
      <button class="sty" data-v="banner"><span class="mini"><span class="banner"><span class="dot"></span><span class="ln"></span></span></span><span data-t="stBanner"></span></button>
      <button class="sty" data-v="minimal"><span class="mini"><span class="minimal">♪ Aa</span></span><span data-t="stMinimal"></span></button>
      <button class="sty" data-v="lyrics"><span class="mini"><span class="lyrics"><span class="dot"></span><span class="lns"><span class="ln"></span><span class="ln"></span></span></span></span><span data-t="stLyrics"></span></button>
      <button class="sty" data-v="visualizer"><span class="mini"><span class="viz"><span class="dot"></span><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span><span data-t="stViz"></span></button>
      <button class="sty" data-v="strip"><span class="mini"><span class="strip"><span class="dot"></span><span class="ln"></span></span></span><span data-t="stStrip"></span></button>
      <button class="sty" data-v="bubble"><span class="mini"><span class="bubble"><span class="dot"></span><span class="ln"></span></span></span><span data-t="stBubble"></span></button>
    </div>
    <div class="styleHint" id="styleHint"></div>
    <div class="row" style="margin-top:12px"><div><b data-t="motion"></b></div>
      <div class="seg" data-key="motion"><button data-v="spring" data-t="mSpring"></button><button data-v="slide" data-t="mSlide"></button><button data-v="fade" data-t="mFade"></button></div></div>
    <div class="row"><div><b data-t="size"></b></div>
      <div><input type="range" min="60" max="160" step="5" data-key="scale"><span class="val" data-unit="%" data-for="scale"></span></div></div>
    <div class="row"><div><b data-t="background"></b></div>
      <div class="seg" data-key="background"><button data-v="cover" data-t="bgCover"></button><button data-v="dark" data-t="bgDark"></button><button data-v="light" data-t="bgLight"></button></div></div>
    <div class="row"><div><b data-t="glow"></b></div>
      <div><input type="range" min="0" max="100" step="5" data-key="glow"><span class="val" data-unit="%" data-for="glow"></span></div></div>
    <div class="row"><div><b data-t="roundness"></b></div>
      <div><input type="range" min="0" max="100" step="5" data-key="roundness"><span class="val" data-unit="%" data-for="roundness"></span></div></div>
    <div class="row"><div><b data-t="opacity"></b></div>
      <div><input type="range" min="30" max="100" step="5" data-key="opacity"><span class="val" data-unit="%" data-for="opacity"></span></div></div>
  </section>

  <section>
    <h2 data-t="secMore"></h2>
    <div class="row"><div><b data-t="interactive"></b><small data-t="interactiveHint"></small></div><input type="checkbox" class="toggle" data-key="interactive"></div>
    <div class="row"><div><b data-t="showKicker"></b><small data-t="showKickerHint"></small></div><input type="checkbox" class="toggle" data-key="showKicker"></div>
    <div class="row"><div><b data-t="showAlbum"></b></div><input type="checkbox" class="toggle" data-key="showAlbum"></div>
    <div class="row"><div><b data-t="showTime"></b></div><input type="checkbox" class="toggle" data-key="showTime"></div>
    <div class="row"><div><b data-t="progress"></b><small data-t="progressHint"></small></div><input type="checkbox" class="toggle" data-key="progress"></div>
    <div class="row"><div><b data-t="autostart" id="autostartLabel"></b><small data-t="autostartHint" id="autostartHint"></small></div><input type="checkbox" class="toggle" data-key="autostart"></div>
  </section>

  <section>
    <h2 data-t="secLights"></h2>
    <p class="lhint" data-t="lightsHint"></p>
    <p class="lhint" id="secretsPlain" data-t="secretsPlain" role="note" hidden></p>
    <div class="row"><div><b data-t="lightBright"></b></div><input type="range" min="20" max="100" step="5" id="lightBright"></div>
    <div class="row"><div><b data-t="lightMax"></b><small data-t="lightMaxHint"></small></div><input type="range" min="10" max="100" step="5" id="lightMax"></div>
    <div class="row"><div><b>Philips Hue</b><small id="hueState"></small></div><input type="checkbox" class="toggle" data-key="hueOn"></div>
    <div class="row lrow"><input type="text" id="hueIp" placeholder="192.168.1.20" inputmode="decimal" autocomplete="off"><button type="button" class="btn" id="hueFind" data-t="hueFind"></button><button type="button" class="btn" id="huePair" data-t="huePair"></button></div>
    <div class="row lrow" id="hueGroupRow" hidden><div><b data-t="hueRoom"></b></div><select id="hueGroup"></select></div>
    <div class="row lrow" id="huePartRow" hidden><div><b data-t="lightsPart"></b></div><div class="chips" id="hueLights"></div></div>
    <div class="row"><div><b>WLED</b><small data-t="wledHint"></small></div><input type="checkbox" class="toggle" data-key="wledOn"></div>
    <div class="row lrow"><input type="text" id="wledIp" placeholder="192.168.1.40" autocomplete="off"><input type="number" id="wledLeds" min="1" max="490" step="1"><small data-t="wledLeds"></small></div>
    <div class="row"><div><b>Govee</b><small id="goveeState" data-t="goveeHint"></small></div><input type="checkbox" class="toggle" data-key="goveeOn"></div>
    <div class="row lrow"><input type="text" id="goveeIps" placeholder="192.168.1.50, 192.168.1.51" autocomplete="off"><button type="button" class="btn" id="goveeScan" data-t="goveeScan"></button></div>
    <div class="row"><div><b>Home Assistant</b><small id="haState" data-t="haHint"></small></div><input type="checkbox" class="toggle" data-key="haOn"></div>
    <div class="row lrow"><input type="text" id="haUrl" placeholder="http://homeassistant.local:8123" autocomplete="off" spellcheck="false"><input type="password" id="haToken" autocomplete="off" spellcheck="false"><button type="button" class="btn" id="haTest" data-t="haTest"></button></div>
    <div class="row lrow"><input type="text" id="haEntities" autocomplete="off" spellcheck="false"></div>
    <div class="row lrow" id="haPartRow" hidden><div><b data-t="lightsPart"></b></div><div class="chips" id="haLights"></div></div>
    <div class="row"><div><b>OpenRGB</b><small data-t="orgbHint"></small></div><input type="checkbox" class="toggle" data-key="orgbOn"></div>
    <div class="row lrow"><input type="text" id="orgbExclude" autocomplete="off" spellcheck="false"></div>
    <div class="row"><div><b>Razer Chroma</b><small data-t="chromaHint"></small></div><input type="checkbox" class="toggle" data-key="chromaOn"></div>
    <p class="lhint" data-t="lightsRestore"></p>
    <div class="row"><div><b data-t="latTitle"></b><small data-t="latHint"></small></div><select id="latDev" aria-label="Device"></select></div>
    <div class="row lrow"><span class="calDot" id="calDot" aria-hidden="true"></span><button type="button" class="btn" id="latMinus">−25</button><input type="number" id="latMs" min="-1000" max="1000" step="5" aria-label="ms"><small>ms</small><button type="button" class="btn" id="latPlus">+25</button><button type="button" class="btn" id="calBtn" data-t="calStart"></button></div>
  </section>

  <section id="histSec" hidden>
    <h2 data-t="history"></h2>
    <div class="hist" id="hist"></div>
  </section>

  <section>
    <h2 data-t="secExtras"></h2>
    <div class="row"><div><b data-t="volumeOsd"></b><small data-t="volumeOsdHint"></small></div><input type="checkbox" class="toggle" data-key="volumeOsd"></div>
    <div class="row" id="fsRow"><div><b data-t="fullscreenQuiet"></b><small data-t="fullscreenQuietHint"></small></div><input type="checkbox" class="toggle" data-key="fullscreenQuiet"></div>
    <div class="row"><div><b data-t="customCss"></b><small data-t="customCssHint"></small></div><button type="button" class="btn" id="cssBtn" data-t="openCss"></button></div>
    <div class="row"><div><b data-t="obs"></b><small id="obsHint"></small></div><input type="checkbox" class="toggle" data-key="obs"></div>
    <div class="row obsUrl" id="obsUrlRow" hidden><div><code id="obsUrl"></code></div><button type="button" class="btn" id="obsCopy" data-t="copy"></button></div>
    <div class="row obsUrl" id="obsPartyRow" hidden><div><small data-t="obsParty"></small><code id="obsParty"></code></div><button type="button" class="btn" id="obsPartyCopy" data-t="copy"></button></div>
    <div class="row"><div><b data-t="control"></b><small data-t="controlHint"></small></div><input type="checkbox" class="toggle" data-key="control"></div>
    <div class="row" id="updRow"><div><b data-t="autoUpdate"></b><small id="updText"></small></div>
      <div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn" id="updBtn"></button><input type="checkbox" class="toggle" data-key="autoUpdate"></div></div>
  </section>

  <section>
    <h2 data-t="secMove"></h2>
    <div class="row"><div><small data-t="moveHint"></small><b id="moveState" role="status" aria-live="polite"></b></div>
      <div class="move"><button type="button" class="btn" id="moveExport" data-t="moveExport"></button><button type="button" class="btn" id="moveImport" data-t="moveImport"></button></div></div>
  </section>
</main>
<script src="i18n.js"></script>
<script>
  let cfg = {}, t = MirageI18n.make("en"), previewT = 0;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  function translate() {
    document.documentElement.lang = t.lang;
    $$("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
    $$(".screen").forEach((el) => (el.title = `${t("screenN")} ${el.dataset.n}`));
  }

  function set(patch, preview = true) {
    Object.assign(cfg, patch);
    mirage.send("set", patch);
    render();
    // nach Änderungen zur Kontrolle eine Vorschau zeigen (gedrosselt)
    if (preview) { clearTimeout(previewT); previewT = setTimeout(() => mirage.send("preview"), 450); }
  }

  function render() {
    $$("[data-key]").forEach((el) => {
      const k = el.dataset.key, v = cfg[k];
      if (el.classList.contains("seg") || el.classList.contains("styles"))
        $$("button[data-v]", el).forEach((b) => b.setAttribute("aria-pressed", String(String(v) === b.dataset.v)));
      else if (el.type === "checkbox") el.checked = !!v;
      else if (document.activeElement !== el) el.value = v;
    });
    $$(".val").forEach((s) => (s.textContent = cfg[s.dataset.for] + " " + s.dataset.unit));
    $$(".screen").forEach((s) => s.setAttribute("aria-pressed", String(cfg.display === s.dataset.id)));
    $$("#grid9 button").forEach((b) => b.setAttribute("aria-pressed", String(cfg.anchor === b.dataset.v)));
    // kurze Beschreibung für Stile, die mehr brauchen als den Songwechsel
    const hint = { lyrics: "stLyricsHint", visualizer: "stVizHint", strip: "stStripHint", bubble: "stBubbleHint" }[cfg.style];
    $("#styleHint").textContent = hint ? t(hint) : "";
    // OBS: empfohlene Größe der Browserquelle = Fenstergröße des Overlays bei dieser Skalierung
    const s = (cfg.scale || 100) / 100;
    $("#obsHint").textContent = t("obsHint").replace("{w}", Math.round(780 * s)).replace("{h}", Math.round(420 * s));
    $("#obsUrlRow").hidden = !cfg.obs;
    $("#obsPartyRow").hidden = !cfg.obs;
    for (const [id, key] of [["hueIp", "hueIp"], ["wledIp", "wledIp"], ["wledLeds", "wledLeds"], ["lightBright", "lightBright"], ["lightMax", "lightMax"], ["goveeIps", "goveeIps"], ["haUrl", "haUrl"], ["haEntities", "haEntities"], ["orgbExclude", "orgbExclude"]]) if (document.activeElement?.id !== id) $("#" + id).value = cfg[key] ?? "";
    if (cfg.hueUser && !$("#hueState").textContent) $("#hueState").textContent = t("huePaired");
    $("#secretsPlain").hidden = !cfg.secretsPlain;
    $("#haToken").placeholder = cfg.haToken ? t("haTokenSet") : t("haToken");
    if (!$("#haEntities").placeholder) $("#haEntities").placeholder = t("haEntities");
    if (!$("#orgbExclude").placeholder) $("#orgbExclude").placeholder = t("orgbExclude");
    renderUpd();
  }

  // Update-Zeile: Text und Knopf je nach Stand
  let upd = { state: "idle" }, version = "", canUpdate = false;
  function renderUpd() {
    const v = upd.version || version;
    const text = { checking: t("updChecking"), current: t("upToDate").replace("{v}", version), available: t("updateAvail").replace("{v}", v),
      loading: t("updateLoading"), ready: t("updateAvail").replace("{v}", v), failed: t("updateFailed") }[upd.state] || t("autoUpdateHint");
    $("#updText").textContent = text + (upd.state === "available" && !canUpdate ? " · " + t("updatePageHint") : "");
    $("#updBtn").textContent = upd.state === "available" || upd.state === "ready" ? (canUpdate ? t("updateInstall").replace("{v}", v) : t("updatePage")) : t("checkNow");
    $("#updBtn").disabled = upd.state === "checking" || upd.state === "loading";
  }

  function buildScreens(displays) {
    const box = $("#screens");
    box.textContent = "";
    if (!displays.length) return;
    const minX = Math.min(...displays.map((d) => d.bounds.x)), minY = Math.min(...displays.map((d) => d.bounds.y));
    const maxX = Math.max(...displays.map((d) => d.bounds.x + d.bounds.width)), maxY = Math.max(...displays.map((d) => d.bounds.y + d.bounds.height));
    const W = box.clientWidth || 700, H = box.clientHeight;
    const k = Math.min(W / (maxX - minX), H / (maxY - minY)) * 0.96;
    const offX = (W - (maxX - minX) * k) / 2, offY = (H - (maxY - minY) * k) / 2;
    for (const d of displays) {
      const b = document.createElement("button");
      b.className = "screen";
      b.dataset.id = d.id;
      b.dataset.n = d.n;
      Object.assign(b.style, {
        left: offX + (d.bounds.x - minX) * k + 3 + "px", top: offY + (d.bounds.y - minY) * k + 3 + "px",
        width: d.bounds.width * k - 6 + "px", height: d.bounds.height * k - 6 + "px",
      });
      b.innerHTML = `<span>${d.n}${d.primary ? " ★" : ""}</span><small>${d.bounds.width}×${d.bounds.height}</small>`;
      b.onclick = () => set({ display: d.id });
      box.append(b);
    }
  }

  function showStatus(s) {
    $("#status").classList.toggle("on", s.connected);
    $("#statusText").textContent = s.connected ? t("connected") : t("waiting");
    const tr = s.track;
    $("#nowTitle").textContent = tr?.title || "—";
    $("#nowArtist").textContent = tr?.artist || "";
    if (tr?.cover) { $("#nowImg").src = tr.cover; $("#nowImg").classList.remove("hidden"); $("#nowImgPh").classList.add("hidden"); }
    const cols = tr?.colors || [];
    ["--a", "--b", "--c"].forEach((v, i) => cols[i] && document.documentElement.style.setProperty(v, cols[i]));
  }

  // macOS/Linux: Autostart heißt dort nicht „mit Windows“
  if (mirage.platform !== "win32") {
    $("#autostartLabel").dataset.t = "autostartOther";
    $("#autostartHint").dataset.t = "autostartHintOther";
  }
  document.documentElement.classList.toggle("mac", mirage.platform === "darwin");

  // Raster für die Position
  for (const v of ["top", "middle", "bottom"]) for (const h of ["left", "center", "right"]) {
    const b = document.createElement("button");
    b.dataset.v = `${v}-${h}`;
    b.setAttribute("aria-label", `${v} ${h}`);
    b.onclick = () => set({ anchor: b.dataset.v });
    $("#grid9").append(b);
  }
  $$(".seg, .styles").forEach((g) => $$("button[data-v]", g).forEach((b) => (b.onclick = () => set({ [g.dataset.key]: b.dataset.v }))));
  $$("input[data-key]").forEach((el) => {
    const k = el.dataset.key;
    el.addEventListener(el.type === "range" ? "input" : "change", () =>
      set({ [k]: el.type === "checkbox" ? el.checked : el.type === "range" ? Number(el.value) : el.value }, k !== "autostart"));
  });
  $("#previewBtn").onclick = () => mirage.send("preview");
  $("#cssBtn").onclick = () => mirage.send("openCss");
  $("#updBtn").onclick = () => mirage.send("checkUpdate");
  $("#obsPartyCopy").onclick = async () => {
    try { await navigator.clipboard.writeText($("#obsParty").textContent); $("#obsPartyCopy").textContent = t("copied"); }
    catch { getSelection().selectAllChildren($("#obsParty")); }
    setTimeout(() => ($("#obsPartyCopy").textContent = t("copy")), 1600);
  };
  // Verlauf: zuletzt gespielte Songs; ein Klick öffnet den Song in Spotify
  function drawHistory(list) {
    const box = $("#hist");
    box.replaceChildren(...(list || []).slice(0, 20).map((h) => {
      const b = document.createElement("button");
      b.type = "button";
      if (/^https:\/\/i\.scdn\.co\//.test(h.cover || "")) {
        const im = new Image();
        im.alt = "";
        im.src = h.cover;
        b.append(im);
      }
      const s = document.createElement("span"), ti = document.createElement("b"), ar = document.createElement("small");
      ti.textContent = h.title;
      ar.textContent = `${h.artist} · ${new Date(h.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      s.append(ti, ar);
      b.append(s);
      b.onclick = () => mirage.send("openUri", h.uri);
      return b;
    }));
    $("#histSec").hidden = !(list || []).length;
  }
  mirage.on("history", drawHistory);
  // Licht im Raum: Textfelder speichern beim Verlassen, Hue koppeln über den Knopf auf der Bridge
  const setText = (id, key, num) => ($("#" + id).onchange = () => mirage.send("set", { [key]: num ? Number($("#" + id).value) || 0 : $("#" + id).value.trim() }));
  setText("hueIp", "hueIp");
  setText("wledIp", "wledIp");
  setText("wledLeds", "wledLeds", true);
  setText("goveeIps", "goveeIps");
  // Home Assistant: Adresse ohne / am Ende; das Token wird nur gesendet, nie angezeigt
  $("#haUrl").onchange = () => mirage.send("set", { haUrl: $("#haUrl").value.trim().replace(/\/+$/, "") });
  $("#haToken").onchange = () => {
    const v = $("#haToken").value.trim();
    if (v) mirage.send("set", { haToken: v });
    $("#haToken").value = "";
  };
  setText("haEntities", "haEntities");
  setText("orgbExclude", "orgbExclude");
  // Lampen von der Show ausnehmen: ein Häkchen je Lampe (an = macht mit); gespeichert wird die Liste der
  // ausgenommenen. items: { token, name, room }
  function drawPart(box, row, key, items) {
    const out = new Set(String(cfg[key] || "").split(/[\s,;]+/).filter(Boolean));
    $(box).replaceChildren(...items.map((it) => {
      const l = document.createElement("label"), c = Object.assign(document.createElement("input"), { type: "checkbox", checked: !out.has(it.token) });
      if (it.room) l.className = "room";
      c.onchange = () => {
        c.checked ? out.delete(it.token) : out.add(it.token);
        cfg[key] = [...out].join(", ");
        mirage.send("set", { [key]: cfg[key] });
      };
      l.append(c, it.name);
      return l;
    }));
    $(row).hidden = !items.length;
  }
  async function loadHueLights() {
    const r = await mirage.invoke("hueLights");
    drawPart("#hueLights", "#huePartRow", "hueExclude", [...(r?.rooms || []).map((x) => ({ token: "g" + x.id, name: x.name, room: true })), ...(r?.lights || []).map((x) => ({ token: x.id, name: x.name }))]);
  }
  // Verzögerung je Gerät einmessen: Lampe und Punkt blinken im selben Takt, der Vorlauf wird verschoben,
  // bis beide gleichzeitig umschalten
  let lat = {}, calOn = false;
  const latDev = () => $("#latDev").value;
  const showLat = () => { if (document.activeElement?.id !== "latMs") $("#latMs").value = lat[latDev()] ?? 0; };
  const setLat = async (ms) => {
    lat = (await mirage.invoke("lightLat", { backend: latDev(), ms })) || lat;
    showLat();
  };
  const drawCal = () => {
    $("#calBtn").textContent = t(calOn ? "calStop" : "calStart");
    if (!calOn) $("#calDot").classList.remove("on");
  };
  $("#latDev").replaceChildren(...[["hue", "Philips Hue"], ["wled", "WLED"], ["govee", "Govee"], ["ha", "Home Assistant"], ["orgb", "OpenRGB"], ["chroma", "Razer Chroma"]].map(([value, textContent]) => Object.assign(document.createElement("option"), { value, textContent })));
  $("#latDev").onchange = () => {
    showLat();
    if (calOn) mirage.invoke("lightCal", latDev());
  };
  $("#latMs").onchange = () => setLat(Number($("#latMs").value) || 0);
  $("#latMinus").onclick = () => setLat((lat[latDev()] || 0) - 25);
  $("#latPlus").onclick = () => setLat((lat[latDev()] || 0) + 25);
  $("#calBtn").onclick = () => {
    calOn = !calOn;
    mirage.invoke("lightCal", calOn ? latDev() : "");
    drawCal();
  };
  // null = das Einmessen ist zu Ende (von selbst nach 90 s oder weil ein anderes Gerät gewählt wurde)
  mirage.on("calBeat", (bright) => {
    if (bright === null) calOn = false, drawCal();
    else if (calOn) $("#calDot").classList.toggle("on", !!bright);
  });
  mirage.invoke("lightLat").then((r) => { lat = r || {}; showLat(); });
  $("#goveeScan").onclick = async () => {
    $("#goveeState").textContent = t("goveeSearching");
    const r = await mirage.invoke("goveeScan");
    $("#goveeState").textContent = r?.list?.length ? t("goveeFound").replace("{n}", r.list.length) : r?.error === "port" ? t("goveePort") : t("goveeNone");
  };
  $("#haTest").onclick = async () => {
    $("#haState").textContent = t("haTesting");
    const r = await mirage.invoke("haTest");
    if (r?.lights) {
      $("#haState").textContent = t("haOk").replace("{n}", r.lights.length);
      if (!$("#haEntities").value.trim()) $("#haEntities").placeholder = r.lights.slice(0, 6).map((l) => l.id).join(", ") + (r.lights.length > 6 ? ", …" : "");
      drawPart("#haLights", "#haPartRow", "haExclude", r.lights.map((l) => ({ token: l.id, name: l.name })));
    } else $("#haState").textContent = t({ url: "haBadUrl", token: "haBadToken" }[r?.error] || "haFail");
  };
  $("#lightBright").oninput = () => mirage.send("set", { lightBright: Number($("#lightBright").value) });
  $("#lightMax").oninput = () => mirage.send("set", { lightMax: Number($("#lightMax").value) });
  $("#hueGroup").onchange = () => {
    cfg.hueGroup = $("#hueGroup").value;
    mirage.send("set", { hueGroup: cfg.hueGroup });
    loadHueLights();
  };
  $("#hueFind").onclick = async () => {
    $("#hueState").textContent = t("hueSearching");
    const ips = await mirage.invoke("hueFind");
    if (ips?.length) {
      $("#hueIp").value = ips[0];
      mirage.send("set", { hueIp: ips[0] });
      $("#hueState").textContent = t("hueFound");
    } else $("#hueState").textContent = t("hueNone");
  };
  $("#huePair").onclick = async () => {
    $("#hueState").textContent = t("huePairing");
    const r = await mirage.invoke("huePair", $("#hueIp").value);
    $("#hueState").textContent = r?.ok ? t("huePaired") : r?.error === "button" ? t("hueButton") : t("hueUnreachable");
    if (r?.ok) loadGroups(true);
  };
  // fresh: gerade gekoppelt – dann mit dem ersten Raum anfangen statt gleich mit dem ganzen Haus
  async function loadGroups(fresh) {
    const g = await mirage.invoke("hueGroups");
    if (!g?.length) return;
    // „alle Lampen“ (Gruppe 0) steht mit zur Wahl: dort lassen sich dann ganze Räume ausnehmen
    const all = [{ id: "0", name: t("hueAll") }, ...g];
    if (fresh || !all.some((x) => x.id === cfg.hueGroup)) {
      cfg.hueGroup = g[0].id;
      mirage.send("set", { hueGroup: g[0].id });
    }
    $("#hueGroup").replaceChildren(...all.map((x) => Object.assign(document.createElement("option"), { value: x.id, textContent: x.n ? `${x.name} (${x.n})` : x.name, selected: x.id === cfg.hueGroup })));
    $("#hueGroupRow").hidden = false;
    loadHueLights();
  }
  // Einstellungen umziehen: Datei-Dialoge laufen im Hauptprozess, hier nur das Ergebnis als kurze Meldung
  function moveResult(r, okKey) {
    if (!r || r.canceled) return;
    const text = r.ok ? t(okKey).replace("{n}", r.n ?? "") : t(r.error === "invalid" ? "moveInvalid" : "moveFailed");
    $("#moveState").textContent = text;
    clearTimeout(moveResult.t);
    moveResult.t = setTimeout(() => ($("#moveState").textContent = ""), 6000);
  }
  $("#moveExport").onclick = async () => moveResult(await mirage.invoke("exportCfg"), "moveExported");
  $("#moveImport").onclick = async () => moveResult(await mirage.invoke("importCfg"), "moveImported");
  $("#obsCopy").onclick = async () => {
    try { await navigator.clipboard.writeText($("#obsUrl").textContent); $("#obsCopy").textContent = t("copied"); }
    catch { getSelection().selectAllChildren($("#obsUrl")); }
    setTimeout(() => ($("#obsCopy").textContent = t("copy")), 1600);
  };
  // MAC: Vollbild anderer Apps lässt sich dort nicht abfragen
  if (mirage.platform === "darwin") $("#fsRow").hidden = true;
  mirage.on("upd", (u) => { upd = u; renderUpd(); });

  mirage.on("status", showStatus);
  mirage.on("cfg", (c) => { cfg = c; render(); });
  mirage.on("lang", (l) => { t = MirageI18n.make(l); translate(); render(); });

  mirage.get().then((s) => {
    cfg = s.cfg;
    t = MirageI18n.make(s.lang);
    upd = s.upd || upd;
    version = s.version || "";
    canUpdate = !!s.canUpdate;
    $("#obsUrl").textContent = s.obsUrl || "";
    $("#obsParty").textContent = (s.obsUrl || "") + "party";
    drawHistory(s.history);
    if (s.cfg?.hueUser) loadGroups();
    buildScreens(s.displays);
    translate();
    render();
    showStatus(s.status);
    addEventListener("resize", () => { buildScreens(s.displays); translate(); render(); });
  });
</script>
</body>
</html>
