<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap">
<style>
  /* Lautstärke-Anzeige: schmale Kapsel, 40 px Rand ringsum für den Schatten (VOL_M in main.js) */
  :root { --a: rgb(182,156,255); --b: rgb(124,92,255); --ease: cubic-bezier(.22,1,.36,1); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; font-family: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .vol { width: 300px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 20px;
         border-radius: 999px; background: rgba(10, 9, 16, 0.82); border: 1px solid rgba(255,255,255,0.12);
         box-shadow: 0 14px 34px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.2);
         opacity: 0; transform: translateY(10px) scale(0.96); transition: opacity .25s var(--ease), transform .35s var(--ease); }
  .vol.in { opacity: 1; transform: none; }
  svg { width: 22px; height: 22px; fill: #fff; flex: none; }
  .track { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.16); overflow: hidden; }
  .fill { height: 100%; width: calc(var(--v, 0) * 100%); border-radius: inherit; background: linear-gradient(90deg, var(--b), var(--a)); transition: width .12s linear; }
  .muted .fill { background: rgba(255,255,255,0.35); }
  b { width: 42px; text-align: right; font-weight: 800; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .vol, .fill { transition: none; } }
</style>
</head>
<body>
<div class="vol" id="vol">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path id="ic" d=""/></svg>
  <div class="track"><div class="fill"></div></div>
  <b id="pc">0</b>
</div>
<script>
  const vol = document.getElementById("vol");
  const ICON = {
    off: "M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12c0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.5 5 6.7zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z",
    low: "M7 9v6h4l5 5V4l-5 5H7z",
    high: "M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z",
  };
  let hideT = 0;
  mirage.on("vol", ({ value, muted, colors }) => {
    clearTimeout(hideT);
    if (colors?.[0]) document.documentElement.style.setProperty("--a", colors[0]);
    if (colors?.[1]) document.documentElement.style.setProperty("--b", colors[1]);
    const v = muted ? 0 : value;
    vol.style.setProperty("--v", v);
    vol.classList.toggle("muted", muted);
    document.getElementById("pc").textContent = Math.round(v * 100);
    document.getElementById("ic").setAttribute("d", muted || v === 0 ? ICON.off : v < 0.5 ? ICON.low : ICON.high);
    vol.classList.add("in");
  });
  mirage.on("volHide", () => {
    vol.classList.remove("in");
    hideT = setTimeout(() => mirage.send("volDone"), 300);
  });
</script>
</body>
</html>
