<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mirage Party</title>
<style>
  /* Party-Licht als OBS-Browserquelle: Farben des Songs, Ringe im Takt, Blitz beim Drop.
     ?bg=0 macht den Hintergrund durchsichtig (dann leuchtet nur das Licht über dem Stream). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06050b; }
  html.clear, html.clear body { background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const clear = new URLSearchParams(location.search).get("bg") === "0";
document.documentElement.classList.toggle("clear", clear);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0;
const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
addEventListener("resize", size);
size();
let cur = null, at = 0, pal = [[155, 107, 240], [34, 73, 231], [217, 188, 241]];
// dieselbe Verbindung wie die Overlay-Quelle: der Party-Zustand kommt etwa 30-mal pro Sekunde
(function connect() {
  const ws = new WebSocket(`ws://${location.host}/feed?party=1`);
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.ch !== "party" || !m.data) return;
    cur = m.data;
    at = performance.now();
    if (Array.isArray(cur.pal) && cur.pal.length === 3) pal = cur.pal;
  };
  ws.onclose = () => setTimeout(connect, 2000);
})();
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
// flashAt: letzter Blitz. Die Overlay-App deckelt schon (höchstens 3/s, mit „Keine Blitze“ = nf keine), die
// Seite hält trotzdem selbst 0,34 s Abstand – sie kann auch ohne die App in einer alten OBS-Szene hängen
const show = { lit: 0, e: 0, k: 0, d: 0, flash: 0, rings: [], last: 0, flashAt: -1e9 };
let prev = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  const live = cur && now - at < 1500, calm = live && cur.nf === 1;
  const ease = (a, b, f) => a + (b - a) * (1 - Math.exp(-dt * f));
  show.lit = ease(show.lit, live ? 1 : 0, 2.5);
  show.e = ease(show.e, live ? cur.e : 0.2, calm ? 1.5 : 4);
  const k = live ? Math.max(cur.k, cur.a * 0.8) : 0;
  // ein Ring je deutlichem Schlag (nie mehr als 3 pro Sekunde, mit nf keine)
  if (live && !calm && k > 0.55 && show.k < 0.4 && now - show.last > 340) {
    show.rings.push({ r: 0, a: 0.45 + show.e * 0.45, c: pal[show.rings.length % 3] });
    show.last = now;
  }
  show.k = k > show.k && !calm ? k : ease(show.k, k, calm ? 2 : 10);
  if (live && !calm && cur.d > 0.85 && show.d < 0.5 && now - show.flashAt > 340) {
    show.flash = 1;
    show.flashAt = now;
  }
  if (calm) show.flash = 0;
  show.d = live ? cur.d : 0;
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
  if (!clear) {
    ctx.fillStyle = "#06050b";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = "lighter";
  const t = now / 1000, m = Math.max(W, H);
  for (let i = 0; i < 3; i++) {
    const x = W * (0.5 + 0.34 * Math.sin(t * (0.12 + i * 0.04) + i * 2.1)), y = H * (0.5 + 0.3 * Math.cos(t * (0.1 + i * 0.05) + i * 1.3));
    const r = m * (0.42 + 0.12 * show.e) * (1 + show.k * 0.12);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = show.lit * (0.26 + show.e * 0.3 + show.k * 0.24) * (clear ? 0.7 : 1);
    g.addColorStop(0, rgba(pal[i], a));
    g.addColorStop(1, rgba(pal[i], 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  show.rings = show.rings.filter((g) => (g.a *= Math.exp(-dt * 1.6)) > 0.02);
  for (const g of show.rings) {
    g.r += dt * m * (0.55 + show.e * 0.4);
    ctx.lineWidth = 2 + (g.r / m) * 6;
    ctx.strokeStyle = rgba(g.c, g.a * 0.7 * show.lit);
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, g.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (show.flash > 0.01) {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = rgba([255, 255, 255], show.flash * (clear ? 0.5 : 0.8));
    ctx.fillRect(0, 0, W, H);
    show.flash *= Math.exp(-dt * 6);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
