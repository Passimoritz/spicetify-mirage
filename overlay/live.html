<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mirage Live</title>
<style>
  /* Mirage Live: das Handy als Lichtquelle im Raum – Farben des Songs, Puls auf der Kick, Blitz beim Drop */
  :root { --a: 155, 107, 240; --b: 34, 73, 231; --c: 217, 188, 241; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #light { position: fixed; inset: -20%; background:
      radial-gradient(circle at 30% 30%, rgba(var(--a), 0.95), transparent 55%),
      radial-gradient(circle at 75% 60%, rgba(var(--b), 0.9), transparent 55%),
      radial-gradient(circle at 40% 90%, rgba(var(--c), 0.7), transparent 50%);
    filter: saturate(1.4); opacity: 0.15; will-change: transform, opacity; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 0.3em; opacity: 0.6; text-transform: uppercase; }
  footer { position: fixed; left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: center; transition: opacity 0.6s; }
  footer img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: rgba(255, 255, 255, 0.1); }
  footer img:not([src]) { visibility: hidden; }
  footer div { min-width: 0; }
  footer b, footer span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }
  footer b { font-size: 16px; }
  footer span { font-size: 13px; opacity: 0.75; }
  #state { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 15px; opacity: 0.8; pointer-events: none; transition: opacity 0.5s; }
  body.on #state { opacity: 0; }
  body.on.loud footer { opacity: 0.25; }
</style>
</head>
<body>
<div id="light"></div>
<div id="flash"></div>
<header>Mirage Live</header>
<div id="state"></div>
<footer><img alt=""><div><b></b><span></span></div></footer>
<script>
  const de = /^de/i.test(navigator.language || "");
  const T = {
    wait: de ? "Verbunden – starte den Party-Modus in Spotify" : "Connected – start party mode in Spotify",
    lost: de ? "Verbindung weg – versuche es erneut …" : "Connection lost – retrying …",
    tap: de ? "Antippen für Vollbild · Display anlassen" : "Tap for full screen · keep the screen on",
  };
  const $ = (s) => document.querySelector(s);
  const light = $("#light"), flash = $("#flash"), state = $("#state");
  state.textContent = T.tap;
  let last = 0;
  const key = new URLSearchParams(location.search).get("k") || "";
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/feed?k=${encodeURIComponent(key)}`);
    ws.onopen = () => (state.textContent = T.wait);
    ws.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.ch === "party") party(m.data || {});
      else if (m.ch === "track") track(m.data);
    };
    ws.onclose = () => {
      document.body.classList.remove("on");
      state.textContent = T.lost;
      setTimeout(connect, 2000);
    };
  }
  function party(p) {
    last = Date.now();
    document.body.classList.add("on");
    if (Array.isArray(p.pal)) p.pal.slice(0, 3).forEach((c, i) => Array.isArray(c) && document.documentElement.style.setProperty(["--a", "--b", "--c"][i], c.map((v) => Math.round(+v || 0)).join(",")));
    const k = +p.k || 0, e = +p.e || 0, d = +p.d || 0;
    light.style.opacity = Math.min(1, 0.25 + e * 0.55 + k * 0.3).toFixed(3);
    light.style.transform = `scale(${(1 + k * 0.08 + d * 0.06).toFixed(3)}) rotate(${((Date.now() / 90) % 360).toFixed(1)}deg)`;
    flash.style.opacity = (d > 0.85 ? (d - 0.85) * 4 : 0).toFixed(3);
    document.body.classList.toggle("loud", e > 0.5);
  }
  function track(t) {
    if (!t) return;
    $("footer b").textContent = t.title || "";
    $("footer span").textContent = t.artist || "";
    if (t.cover && /^https:\/\//.test(t.cover)) $("footer img").src = t.cover;
  }
  // kommt nichts mehr (Party beendet), sanft ins Dunkle
  setInterval(() => {
    if (Date.now() - last > 1500 && document.body.classList.contains("on")) {
      document.body.classList.remove("on");
      light.style.opacity = "0.15";
      flash.style.opacity = "0";
      state.textContent = T.wait;
    }
  }, 500);
  document.addEventListener("click", () => {
    document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
    navigator.wakeLock?.request("screen").catch(() => {});
  });
  connect();
</script>
</body>
</html>
